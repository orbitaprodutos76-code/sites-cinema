<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Garimpos do Chefe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Garimpos do Chefe: roupa masculina e tênis garimpados em várias lojas, com provador virtual para montar o seu look.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="css">
/* Layout: vitrine branca de galeria; o manequim é a peça central e o dourado só marca achados e preços */
:root{
  --papel:#FFFFFF;
  --papel-2:#F6F5F1;
  --tinta:#16140F;
  --tinta-2:#5F5A4E;
  --linha:#E8E5DC;
  --ouro:#C79A2B;
  --ouro-forte:#8F6A12;
  --oferta:#B42318;
  --ok:#1F7A4D;
  --display:"Archivo","Arial Narrow",Impact,system-ui,sans-serif;
  --texto:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --raio:14px;
  --mola:cubic-bezier(.2,.8,.2,1);
  --mola-forte:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--papel)}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(255,255,255,.9)}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--ouro);outline-offset:3px;border-radius:6px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.miolo{max-width:1240px;margin:0 auto}
.rotulo{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2)}
.num{font-variant-numeric:tabular-nums}

/* barra de progresso de rolagem */
.progresso{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:70;background:var(--ouro);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
@supports (animation-timeline:scroll()){.progresso{animation:progresso linear both;animation-timeline:scroll(root)}}
@keyframes progresso{to{transform:scaleX(1)}}

/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s;animation:desce .8s var(--mola) both}
.topo.rolou{border-color:var(--linha);box-shadow:0 8px 30px -20px rgba(22,20,15,.35)}
.topo .miolo{display:flex;align-items:center;gap:16px;height:68px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:850;font-stretch:115%;letter-spacing:-.01em;font-size:18px;line-height:1;white-space:nowrap}
.marca small{display:block;font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--ouro-forte);margin-top:3px}
.marca svg{width:34px;height:34px;flex:none;transition:transform .6s var(--mola-forte)}
.marca:hover svg{transform:rotate(-14deg) scale(1.08)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a,.nav button{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:0;background:none;text-decoration:none;font-weight:600;font-size:15px;position:relative;transition:background .25s}
.nav a:hover,.nav button:hover{background:var(--papel-2)}
.nav svg{width:20px;height:20px;flex:none}
.nav a,.nav button{white-space:nowrap}
.nav .botao-look{background:var(--tinta);color:var(--papel)}
.nav .botao-look:hover{background:#2c2920}
.contador{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ouro);color:var(--tinta);font-family:var(--mono);font-size:12px;display:inline-grid;place-items:center}
.contador.pula{animation:pula .6s var(--mola-forte)}
@keyframes pula{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.so-largo{display:inline}
@media (max-width:480px){.marca small{display:none}.marca{font-size:13px;gap:7px;min-width:0;white-space:normal;max-width:120px}.nav a,.nav button{padding:8px 9px!important}.marca svg{width:28px;height:28px}.topo .miolo{gap:8px}.nav{gap:2px}}
@media (max-width:720px){.so-largo{display:none}.nav a,.nav button{padding:9px 11px}.marca{font-size:16px}}

/* hero */
.hero{padding-block:48px 28px;position:relative;overflow:hidden}
.hero .miolo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:40px;align-items:center}
@media (max-width:900px){.hero .miolo{grid-template-columns:minmax(0,1fr);gap:28px}}
.selo{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--linha);border-radius:999px;font-size:13px;font-weight:600;background:var(--papel);animation:aparece .8s .1s var(--mola) both}
.selo i{width:8px;height:8px;border-radius:50%;background:var(--ouro);box-shadow:0 0 0 0 rgba(199,154,43,.6);animation:pulso 2.2s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 10px rgba(199,154,43,0)}100%{box-shadow:0 0 0 0 rgba(199,154,43,0)}}
.titulo{font-family:var(--display);font-weight:900;font-stretch:122%;font-size:clamp(46px,9.2vw,124px);line-height:.86;letter-spacing:-.035em;margin:22px 0 22px;text-transform:uppercase}
.titulo .linha-t{display:block;overflow:hidden;padding-bottom:.04em}
.titulo .letra{display:inline-block;animation:sobe 1s var(--mola) both;animation-delay:calc(var(--i)*38ms + 150ms)}
.titulo .ouro{background:linear-gradient(100deg,var(--ouro-forte) 0%,var(--ouro) 35%,#F3D98C 50%,var(--ouro) 65%,var(--ouro-forte) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sobe 1s .55s var(--mola) both,brilho 5s 1.6s ease-in-out infinite;display:inline-block}
@keyframes sobe{from{transform:translateY(108%) rotate(4deg)}to{transform:none}}
@keyframes brilho{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.sub{font-size:clamp(17px,1.6vw,20px);color:var(--tinta-2);max-width:34ch;animation:aparece .9s .7s var(--mola) both}
.giro{display:inline-grid;vertical-align:bottom;color:var(--tinta);font-weight:700}
.giro span{grid-area:1/1;transition:transform .6s var(--mola),opacity .4s;white-space:nowrap}
.giro span:not(.ativo){opacity:0;transform:translateY(60%)}
.giro span.sai{opacity:0;transform:translateY(-60%)}
.acoes{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;animation:aparece .9s .85s var(--mola) both}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;border-radius:999px;border:1.5px solid var(--tinta);background:var(--tinta);color:var(--papel);font-weight:700;font-size:16px;text-decoration:none;transition:transform .35s var(--mola),background .25s,color .25s,box-shadow .35s;will-change:transform}
.btn:hover{box-shadow:0 14px 30px -14px rgba(22,20,15,.55)}
.btn:active{transform:scale(.96)!important}
.btn.claro{background:var(--papel);color:var(--tinta)}
.btn.claro:hover{background:var(--papel-2)}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:var(--tinta)}
.btn.pequeno{padding:10px 16px;font-size:14px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;transition:transform .35s var(--mola)}
.btn:hover svg{transform:translateX(3px)}
.fatos{display:flex;flex-wrap:wrap;gap:28px;margin-top:34px;animation:aparece .9s 1s var(--mola) both}
.fatos div{display:grid;gap:2px}
.fatos b{font-family:var(--display);font-stretch:110%;font-size:28px;font-weight:850;line-height:1}
@keyframes aparece{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes desce{from{transform:translateY(-100%)}to{transform:none}}

/* manequim do hero */
.vitrine-viva{position:relative;aspect-ratio:4/5;max-width:440px;width:100%;justify-self:center;border-radius:28px;background:radial-gradient(120% 80% at 50% 0%,#FFFFFF 0%,var(--papel-2) 70%);border:1px solid var(--linha);animation:aparece 1.1s .4s var(--mola) both;overflow:hidden;transform-style:preserve-3d}
.vitrine-viva .etiqueta-flutua{position:absolute;right:16px;top:16px;z-index:3}
.vitrine-viva .legenda{position:absolute;left:16px;right:16px;bottom:14px;z-index:3;display:flex;justify-content:space-between;align-items:end;gap:10px}
.vitrine-viva .legenda b{font-family:var(--display);font-stretch:112%;font-size:24px;font-weight:850;line-height:1}
.brilho-chao{position:absolute;left:12%;right:12%;bottom:7%;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(22,20,15,.16),transparent);z-index:0}

/* etiqueta de preço estilo garimpo */
.etiqueta{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 22px;background:var(--papel);border:1.5px solid var(--tinta);border-radius:6px 999px 999px 6px;font-family:var(--mono);font-weight:600;font-size:13px;transform:rotate(-4deg);box-shadow:0 6px 16px -10px rgba(22,20,15,.4)}
.etiqueta::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;border:1.5px solid var(--tinta)}
.etiqueta.ouro{background:var(--ouro);border-color:var(--tinta)}

/* manequim (compartilhado) */
.manequim{position:absolute;inset:6% 12% 9%;display:flex;flex-direction:column;align-items:center;z-index:1}
.manequim .silhueta{position:absolute;inset:0;z-index:0;opacity:.9}
.slot{position:relative;width:100%;display:flex;align-items:center;justify-content:center;z-index:1}
.slot[data-camada="cabeca"]{height:17%;z-index:4}
.slot[data-camada="cima"]{height:35%;z-index:3;margin-top:1%}
.slot[data-camada="baixo"]{height:34%;z-index:2;margin-top:-3%}
.slot[data-camada="pes"]{height:15%;z-index:3;margin-top:-1%}
.peca{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:4%}
.peca svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 10px 14px rgba(22,20,15,.12))}
.peca img{height:100%;width:100%;object-fit:contain;mix-blend-mode:multiply}
.peca.par svg{height:92%;width:48%}
.peca.par svg:first-child{transform:scaleX(-1)}
.peca.vazia{border:1.5px dashed #D3CFC3;border-radius:16px;color:var(--tinta-2);font-size:13px;font-weight:600}
.peca.entra{animation:entra .6s var(--mola) both}
@keyframes entra{from{transform:translateX(calc(var(--dir,1)*46px)) scale(.9) rotate(calc(var(--dir,1)*4deg));opacity:.2}to{transform:none;opacity:1}}

/* letreiro */
.letreiro{border-block:1px solid var(--linha);overflow:hidden;background:var(--papel);padding-block:14px;margin-top:18px}
.letreiro-trilho{display:flex;width:max-content;animation:letreiro 38s linear infinite}
.letreiro:hover .letreiro-trilho{animation-play-state:paused}
.letreiro span{font-family:var(--display);font-stretch:118%;font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:-.01em;padding-inline:22px;display:flex;align-items:center;gap:44px;white-space:nowrap}
.letreiro span::after{content:"";width:12px;height:12px;background:var(--ouro);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
@keyframes letreiro{to{transform:translateX(-50%)}}

/* seções */
.secao{padding-block:72px}
.cabeca-secao{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
.cabeca-secao h2{font-family:var(--display);font-weight:900;font-stretch:118%;font-size:clamp(34px,5vw,60px);line-height:.92;letter-spacing:-.03em;text-transform:uppercase}
.cabeca-secao p{color:var(--tinta-2);max-width:42ch;margin:10px 0 0}
@supports (animation-timeline:view()){
  .revela{animation:revela linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
}
@keyframes revela{from{opacity:.15;transform:translateY(48px) scale(.98)}to{opacity:1;transform:none}}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:26px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1 1 420px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;border:1.5px solid var(--linha);background:var(--papel);font-weight:600;font-size:14px;transition:all .3s var(--mola);white-space:nowrap}
.chip:hover{border-color:var(--tinta)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel);transform:translateY(-1px)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.6;margin-left:4px}
.busca{position:relative;flex:0 1 260px;min-width:0}
.busca input{width:100%;padding:11px 14px 11px 40px;border-radius:999px;border:1.5px solid var(--linha);background:var(--papel-2);transition:border-color .25s,background .25s}
.busca input:focus{outline:none;border-color:var(--tinta);background:var(--papel)}
.busca svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--tinta-2)}
.ordem select{padding:11px 34px 11px 14px;border-radius:999px;border:1.5px solid var(--linha);background:var(--papel);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tinta) 50%),linear-gradient(135deg,var(--tinta) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;font-weight:600;font-size:14px}

/* grade de produtos */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:22px}
@media (max-width:540px){.grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--raio);background:var(--papel);animation:cardEntra .7s var(--mola) both;animation-delay:calc(var(--i,0)*45ms);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--mola)}
@keyframes cardEntra{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.card .foto{position:relative;aspect-ratio:4/5;border-radius:var(--raio);background:var(--papel-2);overflow:hidden;display:grid;place-items:center;border:0;padding:0;width:100%;cursor:pointer}
.card .foto .peca{width:78%;height:78%;transition:transform .8s var(--mola)}
.card .foto .peca.par svg{height:60%}
.card:hover .foto .peca{transform:scale(1.07) rotate(-2deg)}
.card .foto img{mix-blend-mode:multiply}
.card .selos{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:2}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--papel);border:1px solid var(--linha)}
.tag.desconto{background:var(--oferta);color:#fff;border-color:var(--oferta)}
.tag.achado{background:var(--ouro);border-color:var(--ouro);color:var(--tinta)}
.tag.exemplo{background:var(--papel-2);color:var(--tinta-2)}
.card .rapido{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;gap:6px;opacity:0;transform:translateY(10px);transition:all .45s var(--mola)}
.card:hover .rapido,.card:focus-within .rapido{opacity:1;transform:none}
@media (hover:none){.card .rapido{opacity:1;transform:none}}
.icone{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--tinta);color:var(--papel);box-shadow:0 8px 20px -10px rgba(0,0,0,.6);transition:transform .35s var(--mola-forte)}
.icone:hover{transform:scale(1.12)}
.icone svg{width:18px;height:18px}
.card .info{padding:12px 4px 4px;display:grid;gap:4px}
.card .loja{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2)}
.card h3{font-size:16px;font-weight:600;line-height:1.3}
.precos{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.preco{font-family:var(--mono);font-weight:600;font-size:17px}
.antigo{font-family:var(--mono);font-size:13px;color:var(--tinta-2);text-decoration:line-through}
.card.esgotado .foto{filter:grayscale(1);opacity:.6}
.vazio{grid-column:1/-1;padding:56px 20px;text-align:center;border:1.5px dashed var(--linha);border-radius:var(--raio);color:var(--tinta-2)}

/* montador */
.montador{background:var(--papel-2);border-radius:32px;margin-inline:auto}
.montador .grade-m{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;align-items:start}
@media (max-width:900px){.montador .grade-m{grid-template-columns:minmax(0,1fr)}}
.palco{position:relative;aspect-ratio:4/5;max-width:520px;width:100%;margin:0 auto;background:radial-gradient(110% 70% at 50% 10%,#FFFFFF 0%,#FFFFFF 40%,#F1EFE8 100%);border-radius:26px;border:1px solid var(--linha);overflow:hidden}
.palco .slot{cursor:pointer}
.palco .slot::after{content:"";position:absolute;inset:-2% 6%;border-radius:18px;border:2px solid transparent;transition:border-color .3s,background .3s;pointer-events:none}
.palco .slot:hover::after{background:rgba(199,154,43,.06)}
.palco .slot.ativo::after{border-color:var(--ouro);background:rgba(199,154,43,.07)}
.seta{position:absolute;top:50%;transform:translateY(-50%) scale(.85);width:36px;height:36px;border-radius:50%;border:1.5px solid var(--linha);background:var(--papel);display:grid;place-items:center;z-index:6;opacity:0;transition:all .35s var(--mola)}
.seta svg{width:16px;height:16px}
.seta.esq{left:-14%}.seta.dir{right:-14%}
.palco .slot:hover .seta,.palco .slot.ativo .seta{opacity:1;transform:translateY(-50%) scale(1)}
@media (hover:none){.palco .slot .seta{opacity:1;transform:translateY(-50%) scale(1)}}
.seta:hover{border-color:var(--tinta)}
.nome-slot{position:absolute;left:-14%;top:4%;z-index:6;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-2);background:var(--papel);padding:2px 7px;border-radius:999px;border:1px solid var(--linha);opacity:0;transition:opacity .3s}
.palco .slot.ativo .nome-slot{opacity:1}
.ferramentas-palco{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;gap:8px;z-index:7}
.painel-look{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-width:0}
.painel-look>*{min-width:0}
.lista-look{display:grid;gap:10px}
.linha-look{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px;background:var(--papel);border-radius:16px;border:1.5px solid transparent;transition:border-color .3s,transform .4s var(--mola)}
.linha-look.ativo{border-color:var(--ouro)}
.linha-look:hover{transform:translateX(4px)}
.linha-look .mini{width:64px;height:64px;border-radius:12px;background:var(--papel-2);display:grid;place-items:center;overflow:hidden;border:0;padding:6px}
.linha-look .mini .peca.par svg{height:70%}
.linha-look .t{min-width:0}
.linha-look .t small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2)}
.linha-look .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-look .acoes-l{display:flex;gap:6px}
.mini-btn{border:1.5px solid var(--linha);background:var(--papel);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;transition:border-color .25s,background .25s}
.mini-btn:hover{border-color:var(--tinta)}
.mini-btn.perigo:hover{border-color:var(--oferta);color:var(--oferta)}

function renderChips(){
  const lista=[{id:"todos",nome:"Tudo"},...CATEGORIAS];
  $("#chips").innerHTML=lista.map(c=>{
    const n=c.id==="todos"?produtos.length:produtos.filter(p=>p.categoria===c.id).length;
    if(c.id!=="todos"&&!n) return "";
    return `<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${estado.filtro===c.id}">${esc(c.nome)}<span class="n num">${n}</span></button>`;
  }).join("");
}
function listaFiltrada(){
  const q=estado.busca.trim().toLowerCase();
  let l=produtos.filter(p=>(estado.filtro==="todos"||p.categoria===estado.filtro)&&(!q||(p.nome+" "+p.loja+" "+cat(p.categoria).nome).toLowerCase().includes(q)));
  const o=estado.ordem;
  l.sort((a,b)=>{
    const ea=a.disponivel===false,eb=b.disponivel===false;if(ea!==eb) return ea?1:-1;
    if(o==="menor") return a.preco-b.preco;
    if(o==="maior") return b.preco-a.preco;
    if(o==="desconto") return desconto(b)-desconto(a);
    return (b.destaque?1:0)-(a.destaque?1:0);
  });
  return l;
}
function card(p,i){
  const d=desconto(p);const esg=p.disponivel===false;

function ligarTilt(){
  if(reduzido||!matchMedia("(hover:hover)").matches) return;
  $$("#grade .card").forEach(c=>{

    c.addEventListener("pointerleave",()=>{c.style.setProperty("--ry","0deg");c.style.setProperty("--rx","0deg")});
  });
}

/* ---------- números animados ---------- */
function animarNumero(el,alvo,fmt){
  if(!el) return;
  const de=Number(el.dataset.v||0);el.dataset.v=alvo;
  if(reduzido){el.textContent=fmt(alvo);return}
  const t0=performance.now(),dur=700;
  cancelAnimationFrame(el._raf);
  const passo=t=>{const k=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-k,3);el.textContent=fmt(de+(alvo-de)*e);if(k<1) el._raf=requestAnimationFrame(passo)};
  el._raf=requestAnimationFrame(passo);
}

function equipar(id,{voar=null}={}){

  estado.look[camada]=id;estado.slotAtivo=camada;salvarLook();

}
function passo(camada,dir){

}
function sortear(){
  const mud={};

  salvarLook();
  CAMADAS.forEach((c,i)=>setTimeout(()=>renderSlot(c.id,mud[c.id]),reduzido?0:i*90));
  setTimeout(()=>renderMontador(),reduzido?0:380);
}

/* ---------- vitrine viva do hero ---------- */
let heroTimer=null;
function heroLook(primeiro){
  const alvo=$("#manequim-hero");if(!alvo) return;

  CAMADAS.forEach((c,i)=>{
    const op=opcoes(c.id);let p=null;
    if(op.length){
      if(primeiro){p=porId(estado.look[c.id])||op[0]}
      else{const atual=alvo.querySelector(`.slot[data-camada="${c.id}"]`).dataset.id;const outros=op.filter(x=>x.id!==atual);p=(outros.length?outros:op)[Math.floor(Math.random()*(outros.length||op.length))]}
    }
    if(p) total+=Number(p.preco||0);
    const s=alvo.querySelector(`.slot[data-camada="${c.id}"]`);
    const muda=!primeiro&&p&&s.dataset.id!==p.id;

    if(primeiro||!muda) go(); else setTimeout(go,i*110);
  });

/* ---------- voo para o look ---------- */
function voarPara(origem,p){
  if(reduzido) {toast("Peça adicionada ao look");return}
  const de=origem.getBoundingClientRect();const alvo=$("#ir-look").getBoundingClientRect();
  const v=document.createElement("div");v.className="voo";v.innerHTML=visual(p);

  document.body.appendChild(v);
  const dx=alvo.left+alvo.width/2-(de.left+de.width/2),dy=alvo.top+alvo.height/2-(de.top+de.height/2);

function lerNum(v){const n=parseFloat(String(v||"").replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isFinite(n)?Math.round(n*100)/100:0}

function detectarLoja(l){
  const u=(l||"").toLowerCase();
  if(u.includes("shopee")) return "Shopee";
  if(u.includes("mercadoli")||u.includes("mercadolivre")||u.includes("meli.")) return "Mercado Livre";
  if(u.includes("amazon")||u.includes("amzn")) return "Amazon";

function reduzirImagem(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
      const max=760;const k=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      const cx=cv.getContext("2d");cx.fillStyle="#FFFFFF";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",.82));
    };img.src=r.result};
    r.readAsDataURL(file);
  });
}

/* ---------- cilindro de palavras ---------- */
const PALAVRAS=["GARIMPA","COMBINA","MONTA","VESTE","DOMINA","O CHEFE"];
function montarCilindro(){
  const cil=$("#cil"),q=$("#queda");if(!cil||!q) return;
  const W=cil.clientWidth,H=cil.clientHeight;
  const R=Math.max(90,Math.min(W*.33,240));
  const leve=W<500||(navigator.hardwareConcurrency||8)<=4;
  const N=leve?14:20;
  const lw=2*Math.PI*R/N;
  const fs=lw*1.9;const fh=fs*.92;
  const filas=Math.ceil(H/fh)+1;
  let html="";
  for(let k=0;k<filas*2;k++){
    const w=PALAVRAS[k%filas%PALAVRAS.length]+" ";
    let t="";while(t.length<N) t+=w;t=t.slice(0,N);
    let letras="";
    for(let i=0;i<N;i++){
      const ch=t[i]===" "?"&nbsp;":esc(t[i]);
      const st=`--a:${(360/N*i).toFixed(2)}deg;width:${lw.toFixed(1)}px;margin-left:${(-lw/2).toFixed(1)}px;font-size:${fs.toFixed(1)}px`;
      letras+=`<span class="l" style="${st}">${ch}</span>`+(leve?"":`<span class="l dentro" style="${st}">${ch}</span>`);
    }
    const kk=k%filas;
    html+=`<div class="fila" style="height:${fh.toFixed(1)}px;--tz:${(kk%2?7:-7)}deg"><div class="roda" style="--rdur:${(13+kk%3*3)}s;--rdir:${kk%2?"reverse":"normal"};animation-delay:-${(kk*1.7).toFixed(1)}s">${letras}</div></div>`;
  }
  q.style.setProperty("--qdur",(filas*2.6).toFixed(1)+"s");
  q.style.setProperty("--r",R.toFixed(1)+"px");
  q.innerHTML=html;
}

/* ---------- mármore em alta resolução (WebGL) ---------- */
const FRAG=`precision highp float;uniform vec2 res;uniform float modo;uniform vec2 sem;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float ns(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){v+=a*ns(p);p=m*p;a*=.5;}return v;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*res)/min(res.x,res.y)*2.2+sem;
 vec2 q=vec2(fbm(uv),fbm(uv+vec2(5.2,1.3)));
 vec2 w=vec2(fbm(uv+3.5*q+vec2(1.7,9.2)),fbm(uv+3.5*q+vec2(8.3,2.8)));
 float f=fbm(uv+2.8*w);
 float m=sin((uv.x*.8+uv.y*1.1)*2.2+f*11.);
 float veia=1.-smoothstep(0.,.22,abs(m));
 float fina=1.-smoothstep(0.,.045,abs(m));
 if(modo<.5){
   vec3 base=vec3(.988,.985,.976)-(f-.5)*.045;
   vec3 c=base-vec3(.15,.15,.14)*(veia*.32+fina*.42);
   gl_FragColor=vec4(c,1.);
 }else if(modo<1.5){
   vec3 base=vec3(.055,.055,.052)+f*.06;
   vec3 c=base+vec3(.6,.6,.57)*(veia*.16+fina*.34);
   gl_FragColor=vec4(c,1.);
 }else{
   float cr=abs(fbm(uv*1.4+w*1.6+3.1)-.5);
   float linha=1.-smoothstep(0.,.0045,cr);
   float brilho=exp(-cr*80.)*.75;
   float a=clamp(linha+brilho,0.,1.)*smoothstep(.25,.6,fbm(uv*.6+9.));
   vec3 c=mix(vec3(.76,.54,.14),vec3(1.,.94,.72),linha);
   gl_FragColor=vec4(c*a,a);
 }
}`;
let gl=null,glCv=null,glProg=null;
function prepararGL(){
  if(gl) return true;
  try{
    glCv=document.createElement("canvas");
    gl=glCv.getContext("webgl",{preserveDrawingBuffer:true,premultipliedAlpha:true,antialias:false});
    if(!gl) return false;
    const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));return s};
    glProg=gl.createProgram();
    gl.attachShader(glProg,sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"));
    gl.attachShader(glProg,sh(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(glProg);gl.useProgram(glProg);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(glProg,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    return true;
  }catch(e){gl=null;return false}
}
function pintarMarmore(cv,modo,sem){
  if(!cv||!prepararGL()) return;
  const r=cv.getBoundingClientRect();if(!r.width||!r.height) return;
  const dpr=innerWidth<900?1:Math.min(window.devicePixelRatio||1,3);
  let w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);
  const teto=innerWidth<900?1600:3840;const k=Math.min(1,teto/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const mx=gl.getParameter(gl.MAX_VIEWPORT_DIMS);const k2=Math.min(1,mx[0]/w,mx[1]/h);w=Math.floor(w*k2);h=Math.floor(h*k2);
  glCv.width=w;glCv.height=h;gl.viewport(0,0,w,h);
  gl.uniform2f(gl.getUniformLocation(glProg,"res"),w,h);
  gl.uniform1f(gl.getUniformLocation(glProg,"modo"),modo);
  gl.uniform2f(gl.getUniformLocation(glProg,"sem"),sem[0],sem[1]);
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);
  cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.clearRect(0,0,w,h);cx.drawImage(glCv,0,0);
  cv.classList.add("pronto");
}
const FUNDOS=[["#marmore-claro",0,[1.3,.4]],["#marmore-escuro",1,[7.1,3.3]],["#marmore-rachas",2,[7.1,3.3]]];
const ocioso=f=>(window.requestIdleCallback?requestIdleCallback(f,{timeout:1200}):setTimeout(f,120));
let obsFundo=null;
function pintarFundos(){
  if(obsFundo) obsFundo.disconnect();
  const pintar=(sel)=>{const d=FUNDOS.find(x=>x[0]===sel);ocioso(()=>pintarMarmore($(d[0]),d[1],d[2]))};
  if(!("IntersectionObserver" in window)){FUNDOS.forEach(d=>pintar(d[0]));return}
  obsFundo=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){obsFundo.unobserve(e.target);pintar("#"+e.target.id)}}),{rootMargin:"1600px 0px"});
  FUNDOS.forEach(d=>{const c=$(d[0]);c&&obsFundo.observe(c)});
}
function pausarForaDaTela(){
  if(!("IntersectionObserver" in window)) return;
  const o=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("fora",!e.isIntersecting)),{rootMargin:"100px 0px"});
  $$(".cinetica,.marmore,.letreiro,.hero").forEach(el=>o.observe(el));
}

/* ---------- cursor e medalha ---------- */
function cursorEstiloso(){
  if(reduzido||!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  const c=document.createElement("div");c.className="cursor";c.setAttribute("aria-hidden","true");document.body.appendChild(c);
  let x=0,y=0,cx=0,cy=0;
  addEventListener("pointermove",e=>{x=e.clientX;y=e.clientY;c.classList.add("on");c.classList.toggle("grande",!!(e.target.closest&&e.target.closest("a,button,.slot,[data-ver]")))},{passive:true});
  document.addEventListener("pointerleave",()=>c.classList.remove("on"));
  let rodando=false;
  const loop=()=>{cx+=(x-cx)*.22;cy+=(y-cy)*.22;c.style.transform=`translate3d(${cx}px,${cy}px,0)`;if(Math.abs(x-cx)+Math.abs(y-cy)>.5) requestAnimationFrame(loop); else rodando=false};
  addEventListener("pointermove",()=>{if(!rodando){rodando=true;requestAnimationFrame(loop)}},{passive:true});
}
function medalhaViva(){
  const m=$("#medalha");if(!m||reduzido||!matchMedia("(hover:hover)").matches) return;
  const sec=$("#chefe");
  sec.addEventListener("pointermove",e=>{const r=m.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;m.style.setProperty("--my",(x*18)+"deg");m.style.setProperty("--mx",(-y*18)+"deg")});
  sec.addEventListener("pointerleave",()=>{m.style.setProperty("--my","0deg");m.style.setProperty("--mx","0deg")});
}
function efeitosVisuais(){

}
