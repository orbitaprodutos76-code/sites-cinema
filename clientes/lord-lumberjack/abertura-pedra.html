<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lord Lumberjack · Pedra</title>
<style>
:root{--bg:#030403}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:3}
:root{--verde:#6dbb3a;--led:#f4fbef}
/* site por trás (topo real da v5) */
.site{position:fixed;inset:0;z-index:1;color:var(--led);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
.site__foto{position:absolute;inset:0;background:url(img/foto-1757354912336.jpg) center 30%/cover;transform:scale(1.08);transition:transform 2.4s cubic-bezier(.16,1,.3,1)}
.site.on .site__foto{transform:scale(1)}
.site__foto::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgb(3 4 3/.92) 0%,rgb(3 4 3/.55) 55%,rgb(3 4 3/.25)),linear-gradient(0deg,rgb(3 4 3/.9),transparent 45%)}
.site__txt{position:absolute;left:clamp(1.25rem,6vw,5rem);bottom:clamp(2rem,12vh,7rem);max-width:36rem}
.site__txt>*{opacity:0;transform:translateY(18px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.site.on .site__txt>*{opacity:1;transform:none}
.site.on .site__txt>:nth-child(2){transition-delay:.12s}.site.on .site__txt>:nth-child(3){transition-delay:.24s}.site.on .site__txt>:nth-child(4){transition-delay:.36s}
.nota{display:inline-block;font:600 .7rem Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;border:1px solid rgb(244 251 239/.2);border-radius:99px;padding:.5em 1em;margin-bottom:1.4rem}
.nota b{color:var(--verde);letter-spacing:.1em}
.site h1{font:500 clamp(2.6rem,7vw,5.6rem)/1 'Bodoni Moda',Georgia,serif;margin-bottom:1.2rem}
.site h1 em{color:var(--verde)}
.site p{color:rgb(244 251 239/.72);line-height:1.6;max-width:30rem;margin-bottom:1.8rem}
.cta{display:inline-block;background:var(--verde);color:#030403;font:700 .8rem Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:1.1em 2em;border-radius:99px}
.cta:focus-visible,.ui button:focus-visible{outline:2px solid var(--verde);outline-offset:3px}
.clarao{position:fixed;inset:0;z-index:2;background:radial-gradient(40% 70% at 50% 50%,rgb(109 187 58/.55),transparent 70%);opacity:0;pointer-events:none}
.ui{position:fixed;right:1.25rem;bottom:1.25rem;z-index:6;display:flex;gap:.5rem}
.ui button{background:rgb(3 4 3/.5);color:rgb(244 251 239/.7);border:1px solid rgb(244 251 239/.2);border-radius:99px;padding:.55em 1.1em;font:700 .68rem Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
.ui button:hover{color:var(--verde);border-color:var(--verde)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="site" id="site">
  <div class="site__foto" role="img" aria-label="Interior da Lord Lumberjack com o letreiro LORD na parede"></div>
  <div class="site__txt">
    <span class="nota"><b>★★★★★</b> 5,0 no Google · 125 avaliações</span>
    <h1>Seu corte em <em>outro nível.</em></h1>
    <p>Barbearia em Mineiros, com espelhos iluminados, sinuca e cerveja gelada esperando você. Agende em 30 segundos e chegue só na sua hora.</p>
    <a class="cta" href="https://sites.appbarber.com.br/lordlumberjackb-nxpr">Agendar horário</a>
  </div>
</main>
<div class="clarao" id="clarao"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="ui" id="ui"><button id="pular">Pular</button><button id="denovo" hidden>Ver de novo</button></div>
<script>
(() => {
'use strict';
const Q=new URLSearchParams(location.search);
const cv=document.getElementById('gl');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){ document.body.style.background='#000'; return; }
const HDR=!!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

// ---------- shaders ----------
const VS=`#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv=p*.5+.5; gl_Position=vec4(p,0,1); }`;

const SCENE=`#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uMap; uniform vec2 uRes; uniform vec3 uCam,uTgt; uniform float uFov,uT,uTime;
uniform vec2 uSpot; uniform float uKey; uniform vec3 uUp;
const float MH=0.82759;            // altura do mapa (largura = 1)
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+17.1; a*=.5; } return s; }
// pedra: relevo grosso + poros finos
// poro/cristal redondo (antes era célula quadrada e virava quadradinho no close)
float ponto(vec2 w,float esc,float lim,float raio){ vec2 c=floor(w*esc), f=fract(w*esc); float h=h21(c); vec2 o=vec2(h21(c+7.1),h21(c+3.3))*.5+.25; return step(lim,h)*smoothstep(raio,raio*.5,length(f-o)); }
float stoneH(vec2 w){ return fbm(w*34.)*.65 + fbm(w*150.)*.35 - ponto(w,900.,.985,.3)*.6; }
vec4 mapAt(vec2 w){
  vec2 uv=vec2(w.x+.5,(MH*.5-w.y)/MH);
  if(any(lessThan(uv,vec2(0)))||any(greaterThan(uv,vec2(1)))) return vec4(-99.,99.,0.,0.);
  vec4 m=texture(uMap,uv);
  float edge=smoothstep(0.,.04,min(min(uv.x,1.-uv.x),min(uv.y,1.-uv.y)));
  return vec4((m.r*255.-128.)/12., mix(99.,m.g*5.,edge), m.b, edge);   // sdf (px da logo), chegada (s), semente
}
float groove(float sdf){ return smoothstep(-.4,2.4,sdf); }          // 0 = pedra, 1 = fundo do sulco
// chegada "viva": o líquido acelera e segura conforme a região (não anda em ritmo de máquina)
float chegada(vec2 w,float arr){ return arr*(1.+.16*(vn(w*7.)-.5)) + .10*(vn(w*19.+3.1)-.5); }
// x = quanto da fenda está cheio, y = calor da ponta que avança
vec2 liq(vec2 w,vec4 m){
  float tl=uT-chegada(w,m.y);
  tl-=.16*exp(-m.x*.55);                     // corre pelo meio primeiro: ponta em língua, bordas depois
  tl+=(vn(w*380.+vec2(0,uTime*2.))-.5)*.04;  // borda da ponta irregular
  float fill=smoothstep(0.,.07,tl)*smoothstep(.1,1.,m.x);
  return vec2(fill, exp(-max(tl,0.)*9.)*fill);
}
// o líquido tem volume: sobe dentro do sulco e faz menisco na ponta
float height(vec2 w){ vec4 m=mapAt(w); vec2 l=liq(w,m); return stoneH(w)*.0016 - groove(m.x)*.0062 + l.x*.0047*(1.+.5*l.y); }

void main(){
  vec2 q=(vUv*2.-1.)*vec2(uRes.x/uRes.y,1.);
  vec3 f=normalize(uTgt-uCam), r=normalize(cross(f,uUp)), u=cross(r,f);
  vec3 rd=normalize(f + (q.x*r + q.y*u)*tan(uFov*.5));
  if(rd.z>=-.0001){ o=vec4(0,0,0,10.); return; }
  float dist=-uCam.z/rd.z; vec3 P=uCam+rd*dist; vec2 w=P.xy;

  vec4 m=mapAt(w); float sdf=m.x, arr=m.y, sd=m.z;
  float e=.0009;
  float h0=height(w), hx=height(w+vec2(e,0)), hy=height(w+vec2(0,e));
  vec3 n=normalize(vec3(-(hx-h0)/e,-(hy-h0)/e,1.));
  vec3 V=-rd;

  // pedra preta texturizada
  float tone=fbm(w*22.)*.6+fbm(w*90.)*.4;
  vec3 alb=vec3(.030,.033,.031)*(.55+.9*tone);
  float speck=ponto(w,1400.,.993,.22);                        // cristais do granito
  float g=groove(sdf);
  alb*=1.-.6*g;                                                // fundo do sulco mais escuro

  // luz rasante (chave) num foco de luz sobre a pedra
  vec3 L=normalize(vec3(-.78,.52,.34));
  float pool=smoothstep(.85,.05,length(w-uSpot));
  float dif=max(dot(n,L),0.);
  vec3 H=normalize(L+V);
  float spec=pow(max(dot(n,H),0.),70.)*.55 + speck*pow(max(dot(n,H),0.),8.)*2.2;
  vec3 key=vec3(1.,.97,.92)*1.25*pool*uKey;
  vec3 col=alb*dif*key + spec*key*.35 + alb*.05;

  // luz líquida dentro do sulco
  vec2 lq=liq(w,m); float fill=lq.x, front=lq.y;
  float tl=uT-chegada(w,arr);
  float core=smoothstep(.8,4.5,sdf);
  // correnteza: faixas de brilho que andam no sentido do fluxo (a chegada é a coordenada ao longo da fenda)
  float corr=.72+.28*smoothstep(.2,1.,sin(arr*34.-uTime*19.+vn(w*240.)*4.));
  float shimmer=.9+.1*vn(w*260.+vec2(uTime*.7,-uTime*1.3));
  vec3 em=mix(vec3(.13,.58,.08),vec3(.78,1.,.70),core*.38)*2.0*fill*shimmer*corr;
  em+=vec3(.85,1.,.8)*front*2.6;
  // superfície molhada: reflexo da luz da cena no líquido
  float specL=pow(max(dot(n,H),0.),120.)*fill;
  em+=vec3(.9,1.,.9)*specL*1.6;

  // a luz vaza e acende a textura da pedra em volta
  float dOut=max(-sdf,0.);
  float litN=smoothstep(0.,.35,tl)*m.w;
  float spill=litN*(exp(-dOut/2.2)*.9+exp(-dOut/5.5)*.28)*smoothstep(10.2,5.5,dOut);
  vec3 sc=vec3(.32,.85,.18);
  float faceS=.35+.65*clamp(n.z,0.,1.);
  col+=alb*sc*spill*14.*faceS + sc*spill*speck*1.5 + sc*spill*pow(max(dot(n,normalize(V+vec3(0,0,1))),0.),40.)*.25;
  // paredes do sulco ainda vazias pegam o reflexo verde
  col+=sc*g*(1.-fill)*litN*.12;

  col+=em;
  col*=smoothstep(.015,.16,-rd.z);
  o=vec4(col,dist);
}`;

const COPY=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel;
void main(){ vec4 s=vec4(0); for(int i=-1;i<=1;i++) for(int j=-1;j<=1;j++) s+=texture(uTex,vUv+vec2(i,j)*uTexel); o=s/9.; }`;

const BLUR=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uDir;
void main(){ float w[5]=float[](.227,.195,.122,.054,.016); vec4 s=texture(uTex,vUv)*w[0];
  for(int i=1;i<5;i++){ s+=texture(uTex,vUv+uDir*float(i))*w[i]; s+=texture(uTex,vUv-uDir*float(i))*w[i]; } o=s; }`;

const FINAL=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uScene,uBlur,uBlur2; uniform float uFocus,uDof,uTime,uExpo; uniform vec2 uRes;
float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){
  vec4 s=texture(uScene,vUv), b=texture(uBlur,vUv), b2=texture(uBlur2,vUv);
  float coc=clamp(abs(s.a-uFocus)*uDof,0.,1.);
  vec3 c=mix(s.rgb,b.rgb,coc);
  vec3 bloom=max(b.rgb-.55,0.)*.9 + max(b2.rgb-.3,0.)*.55;
  c+=bloom;
  c=aces(c*uExpo);
  c=pow(c,vec3(.95,.97,1.02))*vec3(.98,1.0,.97);              // leve grade fria/verde nas sombras
  vec2 d=vUv-.5; d.x*=uRes.x/uRes.y;
  c*=smoothstep(1.05,.25,length(d));                           // vinheta
  c+=(h(vUv*uRes+fract(uTime*7.)*91.)-.5)*.045;                // grão
  o=vec4(c,1);
}`;

function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
function prog(fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'p'); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){ const a=gl.getActiveUniform(p,i); U[a.name]=gl.getUniformLocation(p,a.name); }
  return {p,U}; }
const P={scene:prog(SCENE),copy:prog(COPY),blur:prog(BLUR),final:prog(FINAL)};
const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

function target(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,HDR?gl.RGBA16F:gl.RGBA8,w,h,0,gl.RGBA,HDR?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  return {t,f,w,h}; }

let W,H,RT={}, scale=1;
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2)*scale;
  W=Math.round(innerWidth*dpr); H=Math.round(innerHeight*dpr); cv.width=W; cv.height=H;
  RT.scene=target(W,H);
  const qw=Math.max(1,W>>2), qh=Math.max(1,H>>2);
  RT.a=target(qw,qh); RT.b=target(qw,qh);
  RT.c=target(Math.max(1,W>>4),Math.max(1,H>>4)); RT.d=target(Math.max(1,W>>4),Math.max(1,H>>4));
}

// ---------- mapa das letras ----------
const mapTex=gl.createTexture();
const img=new Image();
img.onload=()=>{ gl.bindTexture(gl.TEXTURE_2D,mapTex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  start(); };
img.src='img/pedra-mapa.png';

// ---------- coreografia (segundos) ----------
// ponta da luz a cada 0,1 s do mapa (calculado do pedra-mapa.png): a câmera persegue isso
const FRONT=[[0.001,0.289],[0.001,0.289],[-0.014,0.258],[0.001,0.289],[-0.014,0.258],[-0.012,0.245],[-0.008,0.23],[-0.006,0.214],[-0.001,0.188],[-0.005,0.154],[-0.022,0.111],[-0.033,0.077],[-0.042,0.034],[-0.051,-0.006],[-0.055,-0.046],[-0.066,-0.081],[-0.084,-0.123],[-0.059,-0.137],[-0.028,-0.144],[0.009,-0.147],[0.047,-0.151],[0.08,-0.158],[0.114,-0.166],[0.15,-0.174],[0.208,-0.182],[0.233,-0.192],[0.248,-0.2],[0.233,-0.211],[0.196,-0.225],[0.091,-0.255],[0.03,-0.284],[0.103,-0.286],[0.154,-0.286],[0.162,-0.287],[0.22,-0.285]];
const LOSANGO=[-0.108,-0.140];               // losango aceso no centro do "O": onde a câmera mergulha
const LUZ=.2, VEL=1.35;                      // a luz enche tudo em ~2,5 s
const PERSEGUE=1.2, DECOLA=2.3, MERGULHO=3.75, ENTRA=MERGULHO+.12;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=cl(x);return x*x*(3-2*x);}, io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const inQ=x=>{x=cl(x);return x*x*x;};
function frente(T){ let sx=0,sy=0,n=0; for(let d=-.3;d<=.3;d+=.05){ const k=cl((T+d)*10,0,FRONT.length-1), i=Math.floor(k), f=k-i, a=FRONT[i], b=FRONT[Math.min(i+1,FRONT.length-1)]; sx+=mix(a[0],b[0],f); sy+=mix(a[1],b[1],f); n++; } return [sx/n,sy/n]; }
function orbita(alvo,az,el,dist){ const a=az*Math.PI/180, e=el*Math.PI/180;
  return [alvo[0]+dist*Math.cos(e)*Math.cos(a), alvo[1]+dist*Math.cos(e)*Math.sin(a), alvo[2]+dist*Math.sin(e)]; }
function shot(t){
  const T=(t-LUZ)*VEL;
  const asp=W/H, tg=Math.tan(19*Math.PI/180);
  const dAlto=Math.max(.5/tg,.44/(tg*asp));       // altura em que a logo inteira cabe (celular também)
  const fr=frente(Math.max(T,0)+.12);
  let alvo, az, el, dist;
  if(t<PERSEGUE){                                   // 1. rasante, atrás da gota (a gota desce: câmera fica acima dela no mapa)
    const k=t/PERSEGUE;
    alvo=[fr[0],fr[1],0]; az=mix(96,84,k); el=mix(5,9,k); dist=mix(.15,.19,k);
  } else if(t<DECOLA){                              // 2. decola rápido girando por cima até o lado da frente
    const k=io((t-PERSEGUE)/(DECOLA-PERSEGUE));
    const centro=[0,-.02,0];
    alvo=[mix(fr[0],centro[0],k), mix(fr[1],centro[1],k), 0];
    az=mix(84,-90,k); el=mix(9,62,Math.sin(Math.PI*Math.min(k*1.25,1)*.5)); dist=mix(.19,dAlto,k);
  } else {                                          // 3. desce e mergulha no losango
    const k=(t-DECOLA)/(MERGULHO-DECOLA), kk=sm(k);
    alvo=[mix(0,LOSANGO[0],kk), mix(-.02,LOSANGO[1],kk), 0];
    az=-90; el=mix(62,82,kk); dist=Math.exp(mix(Math.log(dAlto),Math.log(.02),Math.pow(cl(k),1.6))); // desce sem pausa, acelerando
  }
  const cam=orbita(alvo,az,el,dist);
  const upv=[0,0,1];                               // elevação fica abaixo de 88°: a imagem gira com a órbita, sem capotar
  const revela=sm(t/.35);
  const pulso=Math.exp(-Math.pow((t-(LUZ+2.5/VEL+.1))*5,2))*.2;
  const entra=inQ((t-MERGULHO+.12)/.35);             // ao encostar no losango, a luz toma a tela
  return { T, cam, tgt:alvo, up:upv, fov:mix(40,50,inQ((t-DECOLA)/(MERGULHO-DECOLA))*.8)*Math.PI/180,
    spot:[alvo[0]-.4*(1-revela), alvo[1]+.05], dof:t<PERSEGUE?4.5:mix(1.5,3.5,inQ((t-DECOLA)/(MERGULHO-DECOLA))),
    expo:mix(.3,t<PERSEGUE?.72:1,revela)+pulso+entra*7, key:mix(3.,1.5,sm((t-LUZ)/1.))+ (t>PERSEGUE&&t<DECOLA?.8:0) };
}
function pass(pr,rt){ gl.useProgram(pr.p); gl.bindFramebuffer(gl.FRAMEBUFFER,rt?rt.f:null); gl.viewport(0,0,rt?rt.w:W,rt?rt.h:H); }
function tex(pr,name,t,unit){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t); gl.uniform1i(pr.U[name],unit); }
function blurPair(src,tmp,dst,w,h,k){
  pass(P.blur,tmp); tex(P.blur,'uTex',src.t,0); gl.uniform2f(P.blur.U.uDir,k/w,0); gl.drawArrays(gl.TRIANGLES,0,3);
  pass(P.blur,dst); tex(P.blur,'uTex',tmp.t,0); gl.uniform2f(P.blur.U.uDir,0,k/h); gl.drawArrays(gl.TRIANGLES,0,3);
}

function draw(T,time,S){
  const cam=S.cam, tgt=S.tgt;
  let s=P.scene; pass(s,RT.scene); tex(s,'uMap',mapTex,0);
  gl.uniform2f(s.U.uRes,W,H); gl.uniform3fv(s.U.uCam,cam); gl.uniform3fv(s.U.uTgt,tgt);
  gl.uniform1f(s.U.uFov,S.fov); gl.uniform1f(s.U.uKey,S.key); gl.uniform3fv(s.U.uUp,S.up||[0,0,1]); gl.uniform1f(s.U.uT,T); gl.uniform1f(s.U.uTime,time); gl.uniform2fv(s.U.uSpot,S.spot);
  gl.drawArrays(gl.TRIANGLES,0,3);
  // 1/4 e 1/16 de resolução: desfoque (profundidade de campo) e bloom
  pass(P.copy,RT.a); tex(P.copy,'uTex',RT.scene.t,0); gl.uniform2f(P.copy.U.uTexel,1/W,1/H); gl.drawArrays(gl.TRIANGLES,0,3);
  blurPair(RT.a,RT.b,RT.a,RT.a.w,RT.a.h,1.4);
  pass(P.copy,RT.c); tex(P.copy,'uTex',RT.a.t,0); gl.uniform2f(P.copy.U.uTexel,1/RT.a.w,1/RT.a.h); gl.drawArrays(gl.TRIANGLES,0,3);
  blurPair(RT.c,RT.d,RT.c,RT.c.w,RT.c.h,1.6);
  const d=Math.hypot(tgt[0]-cam[0],tgt[1]-cam[1],tgt[2]-cam[2]);
  const f=P.final; pass(f,null);
  tex(f,'uScene',RT.scene.t,0); tex(f,'uBlur',RT.a.t,1); tex(f,'uBlur2',RT.c.t,2);
  gl.uniform1f(f.U.uFocus,d); gl.uniform1f(f.U.uDof,S.dof); gl.uniform1f(f.U.uTime,time); gl.uniform1f(f.U.uExpo,S.expo); gl.uniform2f(f.U.uRes,W,H);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

const site=document.getElementById('site'), ui=document.getElementById('ui');
const reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
let raf=0, t0=0, acabou=false;
function mostraSite(){ site.classList.add('on'); document.getElementById('denovo').hidden=false; document.getElementById('pular').hidden=true; }
function entraNaLuz(){
  if(acabou) return; acabou=true; cancelAnimationFrame(raf);
  const clarao=document.getElementById('clarao');
  clarao.style.background='radial-gradient(60% 60% at 50% 50%,#eaffdf 0%,#6dbb3a 45%,#0b1a07 100%)';
  clarao.style.zIndex=4;
  clarao.animate([{opacity:1},{opacity:1,offset:.25},{opacity:0}],{duration:1000,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
  cv.style.visibility='hidden';
  mostraSite();
  document.querySelector('.site__foto').animate([{transform:'scale(1.25)',filter:'brightness(2.2) saturate(.6)'},{transform:'scale(1)',filter:'none'}],{duration:1500,easing:'cubic-bezier(.16,1,.3,1)'});
}
function start(){
  resize();
  if(Q.has('quadro')){ const t=parseFloat(Q.get('quadro')); const S=shot(t); draw(S.T,t,S); return; } // quadro fixo (prints e vídeo)
  const visto=(()=>{try{return sessionStorage.getItem('lord-intro')}catch(e){return null}})();
  if(reduz || (visto && !Q.has('intro'))){ cv.style.display='none'; mostraSite(); return; }
  try{sessionStorage.setItem('lord-intro','1')}catch(e){}
  let t=0, ant=0;
  const loop=now=>{ t+=ant?Math.min((now-ant)/1000,.05):0; ant=now; /* engasgo (compilar o 3D, aba lenta) não pula a cena */ const S=shot(Math.min(t,ENTRA)); draw(S.T,t,S); if(t>=ENTRA){ entraNaLuz(); return; } raf=requestAnimationFrame(loop); };
  raf=requestAnimationFrame(loop);
}
document.getElementById('pular').onclick=()=>{ cancelAnimationFrame(raf); entraNaLuz(); };
document.getElementById('denovo').onclick=()=>{ location.search='?intro'; };
addEventListener('resize',()=>{ if(!acabou) resize(); });
})();
</script>
