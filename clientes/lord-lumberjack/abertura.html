<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lord Lumberjack · Abertura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040504;--green2:#6dbb3a;--led:#f4fbef;--ink:#f1ede4;--mute:#8f948c;--ff-display:'Bodoni Moda',Georgia,serif;--ff-label:'Manrope',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--ff-label)}

/* ===== ABERTURA ===== */
.intro{position:fixed;inset:0;overflow:hidden;background:var(--bg);isolation:isolate}
.intro canvas,.intro .lyr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.i-photo{object-fit:cover;object-position:22% 26%;opacity:0;transform-origin:50% 50%;filter:saturate(.85) contrast(1.08) brightness(.82)}
.i-grade{background:linear-gradient(180deg,rgba(4,5,4,.25),rgba(4,5,4,0) 30%,rgba(4,5,4,.55) 78%,rgba(4,5,4,.92));opacity:0}
.i-floor{background:linear-gradient(180deg,transparent 0,transparent 62%,rgba(20,26,18,.55) 63%,rgba(8,10,8,.9) 100%)}
.i-refl{filter:blur(3px);opacity:.2}
.i-bloom{filter:blur(14px) saturate(1.25) brightness(1.25);mix-blend-mode:screen;opacity:.95}
.i-fog{inset:-20% -40% !important;width:180% !important;height:140% !important;mix-blend-mode:screen;opacity:0;will-change:transform,opacity}
.i-flare{position:absolute;left:0;right:0;height:120px;margin-top:-60px;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(225,255,215,.5) 12%,rgba(120,200,90,.15) 45%,transparent 70%);
  transform:scaleY(.035) scaleX(.3)}
.i-flare::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(200,255,180,.25) 35%,transparent 70%);transform:scaleY(28)}
.i-vig{background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 40%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.92) 100%)}
.i-grain{inset:-50% !important;width:200% !important;height:200% !important;opacity:.085;background-repeat:repeat}
.i-bar{position:absolute;left:0;right:0;height:11vh;background:#000;z-index:5}
.i-bar.t{top:0;transform:translateY(-100%)}.i-bar.b{bottom:0;transform:translateY(100%)}

.i-ui{position:absolute;z-index:8;bottom:max(18px,env(safe-area-inset-bottom));right:16px;display:flex;gap:8px}
.i-btn{appearance:none;border:1px solid rgba(241,237,228,.22);background:rgba(4,5,4,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--ink);font:700 11px/1 var(--ff-label);letter-spacing:.24em;text-transform:uppercase;padding:12px 16px;border-radius:999px;cursor:pointer;
  transition:border-color .25s,background .25s,opacity .4s}
.i-btn:hover{border-color:var(--green2);background:rgba(109,187,58,.12)}
.i-btn:focus-visible{outline:2px solid var(--green2);outline-offset:3px}
.i-btn svg{width:14px;height:14px;vertical-align:-3px}
.i-btn.snd{padding:10px 12px}
.i-done .i-ui .skip{opacity:0;pointer-events:none}

/* tela de aprovação (só no teste) */
.stage-end{position:fixed;left:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:9;opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s;max-width:min(560px,calc(100% - 32px))}
.stage-end.on{opacity:1;transform:none}
.stage-end small{display:block;font:700 10px/1 var(--ff-label);letter-spacing:.32em;text-transform:uppercase;color:var(--green2);margin-bottom:10px}
.stage-end p{font:italic 400 clamp(20px,3.2vw,30px)/1.15 var(--ff-display);margin-bottom:14px}
@media (max-width:600px){.i-ui{top:max(14px,env(safe-area-inset-top));bottom:auto}}
</style>
</head>

const clamp = (v,a=0,b=1) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOut = t => 1-Math.pow(1-t,3);
const hash = n => { n = Math.sin(n*127.1+311.7)*43758.5453; return n-Math.floor(n); };

// ---- tempos (s) ----
const T = { end:5.1, lumEnd:3.25, flare:3.22, pulse:[3.4,4.0], cut:[4.0,4.7], fadeLed:[4.68,5.1] };
if(Q.has('nofade')) T.fadeLed=[98,99];

// ---- letreiro real na foto 600x600 (medido em px) ----
const PHOTO = { w:600, h:600, posX:.22, posY:.26 };
const TARGET = {
  mono:   {x0:183,  y0:115, x1:228,   y1:206},
  lord:   {x0:139.5,y0:214.5,x1:265,  y1:265.5},
  lumber: {x0:155.5,y0:275, x1:251,   y1:288}
};

const intro = $('intro'), cv = $('iLed'), ctx = cv.getContext('2d');
const bloom = $('iBloom'), bctx = bloom.getContext('2d');
const refl = $('iRefl'), rctx = refl.getContext('2d');
const photo = $('iPhoto'), grade = $('iGrade'), floorEl = $('iFloor');
const fog1 = $('iFog1'), fog2 = $('iFog2'), flare = $('iFlare'), grain = $('iGrain');
const barT = $('iBarT'), barB = $('iBarB');

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lite = Q.has('lite');
let W=0,H=0,DPR=1, leds=[], drips=[], tubes=[], groups={}, layout=null;

// ---- sprite de brilho ----
const glow = (() => { const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,255,250,1)'); r.addColorStop(.14,'rgba(240,255,232,.95)');
  r.addColorStop(.38,'rgba(150,220,110,.38)'); r.addColorStop(1,'rgba(109,187,58,0)');
  g.fillStyle=r; g.fillRect(0,0,64,64); return c; })();

// ---- grão de filme ----
(() => { const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  const d=g.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255|0; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  g.putImageData(d,0,0); grain.style.backgroundImage=`url(${c.toDataURL()})`; })();

// ---- névoa (bolhas suaves pré-renderizadas) ----
function paintFog(c, seed){
  c.width=640; c.height=360; const g=c.getContext('2d');
  for(let i=0;i<46;i++){
    const x=hash(seed+i)*640, y=120+hash(seed+i*3.1)*220, r=40+hash(seed+i*7.7)*120;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(150,200,130,${.025+hash(i+seed)*.035})`); gr.addColorStop(1,'rgba(150,200,130,0)');
    g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);
  }
}
paintFog(fog1,1); paintFog(fog2,9);

// ---- logo vetorizada → contornos ----
const src = $('logoSrc');
const VB = src.querySelector('svg').viewBox.baseVal;
function readGroup(id){
  const paths=[...src.querySelectorAll(`#${id} path`)];
  const boxes=paths.map(p=>p.getBBox());
  // letra = contornos que se contêm (buracos ficam com a letra de fora)
  const letter=boxes.map((b,i)=>{ let o=i; boxes.forEach((c,j)=>{ if(j!==i && c.x<=b.x+.5 && c.y<=b.y+.5 && c.x+c.width>=b.x+b.width-.5 && c.y+c.height>=b.y+b.height-.5 && c.width*c.height>boxes[o].width*boxes[o].height) o=j; }); return o; });
  const outers=[...new Set(letter)].sort((a,b)=>boxes[a].x-boxes[b].x);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  boxes.forEach(b=>{x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);});
  return { paths, boxes, letterIdx: letter.map(o=>outers.indexOf(o)), nLetters: outers.length, outerBox: o=>boxes[outers[o]], box:{x0,y0,x1,y1} };
}
['mono','lord','lumber'].forEach(id => groups[id]=readGroup(id));

// ---- mapeamento da foto (object-fit: cover) ----
function photoMap(u,v,S=1){
  const sc=Math.max(W/PHOTO.w,H/PHOTO.h), iw=PHOTO.w*sc, ih=PHOTO.h*sc;
  const x=(W-iw)*PHOTO.posX+u*sc, y=(H-ih)*PHOTO.posY+v*sc;
  return [W/2+(x-W/2)*S, H/2+(y-H/2)*S];
}

// ---- monta os LEDs pro tamanho da tela ----
function build(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  bloom.width=Math.ceil(W/4); bloom.height=Math.ceil(H/4); bloom.style.width=W+'px'; bloom.style.height=H+'px';
  refl.width=Math.ceil(W/2); refl.height=Math.ceil(H/2); refl.style.width=W+'px'; refl.style.height=H+'px';
  const s=Math.min(Math.min(W*.8,820)/VB.width, H*.52/VB.height);
  const cx=W/2, cy=H*.47;
  const ox=cx-VB.width*s/2, oy=cy-VB.height*s/2;
  const mirrorY=oy+VB.height*s+10;
  layout={s,cx,cy,ox,oy,mirrorY};
  refl.style.webkitMaskImage=refl.style.maskImage=`linear-gradient(180deg,transparent ${(mirrorY/H*100).toFixed(1)}%,#000 ${(mirrorY/H*100+1).toFixed(1)}%,transparent ${Math.min(100,mirrorY/H*100+22).toFixed(1)}%)`;
  const sp=(lite?6:3)/s;   // espaçamento em unidades do SVG (a linha é contínua)
  leds=[]; drips=[]; tubes=[];
  let n=0, pc=0;
  for(const id of ['mono','lord','lumber']){
    const G=groups[id], B=G.box, tb=TARGET[id];
    G.k={ sx:(tb.x1-tb.x0)/(B.x1-B.x0), sy:(tb.y1-tb.y0)/(B.y1-B.y0) };
    G.paths.forEach((p,pi)=>{
      const L=p.getTotalLength(), cnt=Math.max(4,Math.round(L/sp));
      const li=G.letterIdx[pi], LB=G.outerBox(li);
      let pts=[]; const po=hash(++pc*5.1)*.05;
      for(let i=0;i<cnt;i++){
        const q=p.getPointAtLength(i/cnt*L);
        const yN=(q.y-B.y0)/(B.y1-B.y0), xN=(q.x-B.x0)/(B.x1-B.x0), lyN=(q.y-LB.y)/LB.height;
        let a;   // hora em que a luz chega neste ponto: contínua ao longo do contorno = luz escorrendo
        if(id==='mono') a=.42+yN*.52+po;                 // desce de cima pra baixo
        else if(id==='lord') a=1.0+li*.3+lyN*.44+po;     // letra a letra, escorrendo
        else a=2.62+xN*.52+po*.4;                        // esquerda → direita
        const led={sx:q.x, sy:q.y, a, g:id, seed:hash(n*3.3)};
        pts.push(led); leds.push(led); n++;
      }
      tubes.push({pts, g:id, first:Math.min(...pts.map(l=>l.a)), seed:hash(pc*7.3)});
      // gotas: pontos mais baixos de cada contorno (só L e LORD)
      if(id!=='lumber' && !lite){
        pts.slice().sort((u,v)=>v.sy-u.sy).slice(0, id==='mono'?2:1).forEach((d,k)=>{
          if(hash(n+k*9)<.55) drips.push({led:d, len:(18+hash(n+k)*42), dur:.7+hash(n*k+2)*.6});
        });
      }
    });
  }
}

// posição na tela de um ponto do SVG, com câmera e corte
function place(l, cam, cut, S){
  const {s,cx,cy,ox,oy}=layout;
  let x=ox+l.sx*s, y=oy+l.sy*s;
  x=cx+(x-cx)*cam; y=cy+(y-cy)*cam;
  if(cut>0){
    const G=groups[l.g], B=G.box, tb=TARGET[l.g];
    const [tx,ty]=photoMap(tb.x0+(l.sx-B.x0)*G.k.sx, tb.y0+(l.sy-B.y0)*G.k.sy, S);
    x=lerp(x,tx,cut); y=lerp(y,ty,cut);
  }
  return [x,y];
}

// ---- som (WebAudio, desligado por padrão) ----
let AC=null, hum=null, soundOn=false, lastTick=0, noiseBuf=null;
function soundStart(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  AC.resume();
  if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate*.02,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); }
  if(!hum){
    const g=AC.createGain(); g.gain.value=0; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400;
    [[60,.6],[120,.35],[180,.08]].forEach(([f,v])=>{ const o=AC.createOscillator(), og=AC.createGain(); o.frequency.value=f; og.gain.value=v; o.connect(og).connect(lp); o.start(); });
    lp.connect(g).connect(AC.destination); hum=g;
  }
}
function tick(){
  if(!soundOn||!AC) return; const now=AC.currentTime; if(now-lastTick<.035) return; lastTick=now;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600+Math.random()*900; bp.Q.value=4;
  const g=AC.createGain(); g.gain.value=.11*(.5+Math.random()*.5); s.connect(bp).connect(g).connect(AC.destination); s.start();
}
$('iSnd').addEventListener('click', e=>{
  soundOn=!soundOn; e.currentTarget.setAttribute('aria-pressed',soundOn); e.currentTarget.setAttribute('aria-label',soundOn?'Desligar som':'Ligar som da abertura');
  $('iSndWave').setAttribute('d', soundOn?'M16 9a4 4 0 010 6M19 6a8 8 0 010 12':'M17 9l4 6M21 9l-4 6');
  if(soundOn) soundStart(); else if(hum) hum.gain.setTargetAtTime(0,AC.currentTime,.05);
});

// ---- laço ----
let t0=0, raf=0, frames=0, fpsT=0, done=false, pausedAt=0;
const lit=new Uint8Array(200000);

function render(t){
  const {s,mirrorY}=layout;
  const cam=1+.06*easeOut(clamp(t/4.2));
  const cut=ease(clamp((t-T.cut[0])/(T.cut[1]-T.cut[0])));
  const Sph=lerp(1.07,1,easeOut(clamp((t-T.cut[0])/1.2)));
  const pulse=t>T.pulse[0]&&t<T.pulse[1] ? Math.sin(Math.PI*(t-T.pulse[0])/(T.pulse[1]-T.pulse[0])) : 0;
  const ledFade=1-.86*easeOut(clamp((t-T.fadeLed[0])/(T.fadeLed[1]-T.fadeLed[0])));
  const gain=(1+.5*pulse)*ledFade;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  // ---- tubos de LED: linha contínua que acende escorrendo pelo contorno ----
  const lw=clamp(s/2.4,.75,1.5)*(1+.25*pulse)*(1-.4*cut);
  const base=14*lw;
  let newly=0, bright=0, idx=0;
  ctx.lineJoin='round'; ctx.lineCap='round';
  const PASS=[[7.5,'rgba(109,187,58,',.16],[3.2,'rgba(175,232,145,',.5],[1.25,'rgba(250,255,246,',1]];
  for(const tb of tubes){
    const P=tb.pts, N=P.length, xy=new Array(N), kk=new Float32Array(N);
    let any=false;
    for(let i=0;i<N;i++){
      const dt=t-P[i].a; let k=clamp(dt/.14); k=k*k*(3-2*k); kk[i]=k;
      if(k>0){ any=true; bright+=k; if(!lit[idx+i]){ lit[idx+i]=1; newly++; } }
    }
    if(any){
      for(let i=0;i<N;i++) xy[i]=place(P[i],cam,cut,Sph);
      // partida do neon: o tubo inteiro gagueja nos primeiros instantes
      const since=t-tb.first, flick = since<.34 ? (Math.random()<.4 ? .15 : 1) : 1;
      const breathe=.95+.05*Math.sin(t*8+tb.seed*30);
      const A=gain*flick*breathe;
      // trechos acesos (k≈1) num traço só; a borda que está acendendo vai com alfa parcial
      for(const [w,col,al] of PASS){
        ctx.lineWidth=w*lw;
        ctx.strokeStyle=col+Math.min(1,al*A).toFixed(3)+')';
        ctx.beginPath(); let open=false;
        for(let i=0;i<=N;i++){
          const a=i%N, b=(i+1)%N;
          if(i<N && kk[a]>=.98 && kk[b]>=.98){ if(!open){ ctx.moveTo(xy[a][0],xy[a][1]); open=true; } ctx.lineTo(xy[b][0],xy[b][1]); }
          else open=false;
        }
        ctx.stroke();
        for(let i=0;i<N;i++){
          const b=(i+1)%N, k=Math.min(kk[i],kk[b]);
          if(k>0 && k<.98){ ctx.globalAlpha=k; ctx.beginPath(); ctx.moveTo(xy[i][0],xy[i][1]); ctx.lineTo(xy[b][0],xy[b][1]); ctx.stroke(); ctx.globalAlpha=1; }
        }
      }
      // gota de luz na ponta que avança (o "escorrer")
      for(let i=0;i<N;i++){
        const dt=t-P[i].a;
        if(dt>0 && dt<.22 && (i%3===0)){
          const f=1-dt/.22, sz=base*(.8+.9*f);
          ctx.globalAlpha=Math.min(1,f*A*.9); ctx.drawImage(glow,xy[i][0]-sz/2,xy[i][1]-sz/2,sz,sz);
        }
      }
      ctx.globalAlpha=1;
    }
    idx+=N;
  }
  // gotas que escorrem
  for(const d of drips){
    const dt=t-d.led.a-.1; if(dt<=0||dt>d.dur) continue;
    const p=dt/d.dur, fall=d.len*s/2.6*easeOut(p), [x,y]=place(d.led,cam,cut,Sph);
    const steps=6;
    for(let j=0;j<steps;j++){
      const f=fall*(j/(steps-1)); const a=(1-p)*(.25+.75*(j/(steps-1)))*gain;
      const sz=base*(.35+.4*(j/(steps-1)));
      ctx.globalAlpha=a*.9; ctx.drawImage(glow,x-sz/2,y+f-sz/2,sz,sz);
    }
  }
  ctx.globalAlpha=1;
  if(newly && t<T.lumEnd+.2){ for(let j=0;j<Math.min(newly,3);j++) if(Math.random()<.35) tick(); }

  const B=clamp(bright/leds.length)*(1+.4*pulse);

  // bloom e reflexo (cópias em baixa resolução)
  if(!lite){
    bctx.globalCompositeOperation='copy'; bctx.drawImage(cv,0,0,bloom.width,bloom.height);
    bloom.style.opacity=(.95*ledFade+.05).toFixed(3);
  }
  rctx.setTransform(1,0,0,1,0,0); rctx.clearRect(0,0,refl.width,refl.height);
  const rs=refl.width/W;
  rctx.setTransform(rs,0,0,-rs,0,2*mirrorY*rs);
  rctx.drawImage(cv,0,0,W,H);
  const floorA=1-clamp((t-T.cut[0])/.45);
  refl.style.opacity=(.22*floorA).toFixed(3); floorEl.style.opacity=floorA.toFixed(3);

  // névoa iluminada pelo LED
  if(!lite){
    const fo=(.03+.42*B)*(1-cut);
    fog1.style.opacity=fo.toFixed(3); fog2.style.opacity=(fo*.7).toFixed(3);
    fog1.style.transform=`translate3d(${(-t*14)%400}px,0,0)`; fog2.style.transform=`translate3d(${(t*22)%400-200}px,${Math.sin(t*.7)*6}px,0)`;
  }

  // flare anamórfico na última letra
  const fp=(t-T.flare)/.8;
  if(fp>0&&fp<1){
    const last=leds[leds.length-1], [, fy]=place(last,cam,cut,Sph);
    flare.style.top=fy+'px';
    flare.style.opacity=(Math.sin(Math.PI*fp)).toFixed(3);
    flare.style.transform=`scaleY(.035) scaleX(${(.3+.9*easeOut(fp)).toFixed(3)})`;
  } else flare.style.opacity=0;

  // foto, barras de cinema
  const ph=clamp((t-4.12)/.6);
  photo.style.opacity=ease(ph).toFixed(3);
  photo.style.transform=`scale(${Sph.toFixed(4)})`;
  grade.style.opacity=ph.toFixed(3);
  const barIn=easeOut(clamp(t/.5)), barOut=ease(clamp((t-T.cut[0])/.6));
  barT.style.transform=`translateY(${(-100+100*barIn+(-100)*barOut).toFixed(2)}%)`;
  barB.style.transform=`translateY(${(100-100*barIn+100*barOut).toFixed(2)}%)`;

  // som acompanha o brilho
  if(soundOn&&hum) hum.gain.setTargetAtTime(Math.min(.05,.012+.04*B)*(t<T.end?1:0),AC.currentTime,.08);
}

function grainJitter(){ grain.style.transform=`translate3d(${(Math.random()*-50)|0}%,${(Math.random()*-50)|0}%,0)`; }

function loop(now){
  const t=(now-t0)/1000;
  frames++;
  if(frames===6) fpsT=now;
  if(frames===36 && !lite){ const fps=30000/(now-fpsT); if(fps<40){ lite=true; intro.classList.add('lite'); fog1.style.display=fog2.style.display=bloom.style.display='none'; build(); lit.fill(0);} }
  if(frames%2===0) grainJitter();
  render(Math.min(t,T.end+2));
  if(t>=T.end && !done){ done=true; intro.classList.add('i-done'); finish(); }
  if(t<T.end+2) raf=requestAnimationFrame(loop);
  else idle();
}

// depois do corte: o letreiro respira bem de leve
function idle(){
  let last=0;
  const f=now=>{ if(now-last>66){ last=now; render(T.end+2+Math.sin(now/900)*.0); grainJitter(); } raf=requestAnimationFrame(f); };
  raf=requestAnimationFrame(f);
}

function finish(){
  try{ sessionStorage.setItem('lordIntro','1'); }catch(e){}
  if(hum&&AC) hum.gain.setTargetAtTime(0,AC.currentTime,.3);
  $('stageEnd').classList.add('on');
}

function play(){
  cancelAnimationFrame(raf); lit.fill(0); frames=0; done=false; intro.classList.remove('i-done'); $('stageEnd').classList.remove('on');
  t0=performance.now(); raf=requestAnimationFrame(loop);
}
function skip(){ t0=performance.now()-T.end*1000; if(!raf) raf=requestAnimationFrame(loop); }

$('iSkip').addEventListener('click', skip);
$('again').addEventListener('click', play);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !done) skip(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ pausedAt=performance.now(); cancelAnimationFrame(raf); raf=0; }
  else if(pausedAt){ t0+=performance.now()-pausedAt; pausedAt=0; raf=requestAnimationFrame(loop); }
});
let rz; addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ build(); if(done) render(T.end+2); },120); });

build();
if(lite){ fog1.style.display=fog2.style.display=bloom.style.display='none'; }
// regra do site final: toca 1x por sessão; ?intro força. Nesta página de teste toca sempre.
const alreadySeen = (()=>{ try{ return sessionStorage.getItem('lordIntro')==='1'; }catch(e){ return false; } })();
const isTestPage = true;
if(Q.has('t')){ const ft=parseFloat(Q.get('t')); for(let x=0;x<=ft;x+=.05) render(x); render(ft); }   // quadro congelado (revisão)
else if(reduced || (alreadySeen && !isTestPage && !Q.has('intro'))){ skip(); }
else play();
window.__intro={get lite(){return lite}, get n(){return leds.length}, skip, play};
})();
</script>
</body>
