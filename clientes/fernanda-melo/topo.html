<style>
/* Topo da home: o mármore da parede do salão é o fundo, o nome em ouro fica atrás e a nuvem roxa fofa vive na frente.
   Visual único (claro), não segue o tema escuro do visitante. */
:root{
  --branco:#FFFFFF; --marmore:#F6F3F8; --roxo:#6B21A8; --berinjela:#3B0A57; --ouro:#FBBF24; --ouro-escuro:#9A6510; --tinta:#1E0B30;
  --fd:'DM Serif Display',Georgia,'Times New Roman',serif; --fb:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sai:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--marmore);color:var(--tinta);font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#marmore{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

.topo{position:fixed;inset:0 0 auto;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--berinjela)}
.marca small{font:600 .6rem/1 var(--fb);letter-spacing:.32em;text-transform:uppercase}
.marca span{font:italic 400 1.25rem/1.1 var(--fd);color:var(--roxo)}
.menu{display:flex;gap:clamp(1rem,2.4vw,2rem);font:500 .74rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase}
.menu a{color:var(--berinjela);text-decoration:none;padding:.4em 0;border-bottom:1px solid transparent;transition:border-color .3s}
.menu a:hover{border-color:var(--ouro-escuro)}
.agendar{font:600 .74rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--branco);background:var(--roxo);text-decoration:none;
  border-radius:99px;padding:1em 1.5em;box-shadow:0 0 0 0 var(--ouro);transition:box-shadow .4s var(--sai)}
.agendar:hover{box-shadow:0 0 0 3px var(--ouro)}
@media (max-width:820px){.menu{display:none}}

.hero{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;pointer-events:none;
  font:400 clamp(4.2rem,19vw,21rem)/.84 var(--fd);letter-spacing:-.02em;text-transform:uppercase;text-align:center;
  background:linear-gradient(176deg,#FFE7A0 0%,#F7B92A 26%,#C98712 48%,#F2B42C 64%,#9A6510 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgb(91 52 6/.35)) drop-shadow(0 18px 30px rgb(59 10 87/.18))}
.nome span{display:block}
.nome .l2{margin-top:.06em}

.palco{position:relative;z-index:2;width:min(86vw,900px);aspect-ratio:16/10;max-width:100%;margin-top:clamp(2rem,6vh,4rem)}
#nuvem{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#nuvem:active{cursor:grabbing}
.sombra{position:absolute;left:18%;right:18%;bottom:8%;height:12%;border-radius:50%;
  background:radial-gradient(closest-side,rgb(59 10 87/.32),rgb(59 10 87/0));filter:blur(8px);transform-origin:center;z-index:-1}

.base{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1.2rem;
  padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.base p{margin:0;max-width:24rem;font:500 clamp(.95rem,1.3vw,1.05rem)/1.5 var(--fb);color:var(--tinta);text-wrap:balance}
.base p em{font:italic 400 1.15em/1 var(--fd);color:var(--roxo)}
.cta{display:inline-flex;align-items:center;gap:.8em;background:var(--berinjela);color:var(--branco);text-decoration:none;
  font:600 .8rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;padding:1.2em 2em;border-radius:99px;
  box-shadow:0 0 0 0 var(--ouro),0 16px 36px -16px rgb(59 10 87/.8);transition:box-shadow .45s var(--sai),transform .45s var(--sai)}
.cta:hover{box-shadow:0 0 0 3px var(--ouro),0 20px 40px -16px rgb(59 10 87/.9);transform:translateY(-2px)}
.cta span{transition:transform .45s var(--sai)}
.cta:hover span{transform:translateX(4px)}
.dica{font:600 .62rem/1.3 var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--berinjela);opacity:.75}
@media (max-width:640px){
  .palco{width:100vw;aspect-ratio:1/1;margin-top:2vh}
  .nome{font-size:clamp(3.6rem,19vw,8rem)}
  .base{justify-content:center;text-align:center}
  .base p{max-width:none}
  .dica{display:none}
}
:focus-visible{outline:3px solid var(--ouro-escuro);outline-offset:3px}
</style>

<canvas id="marmore" aria-hidden="true"></canvas>

  </div>
</main>

<script>
(() => {
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const leve = matchMedia('(max-width: 760px), (pointer: coarse)').matches;
const $ = s => document.querySelector(s);
function programa(gl, fs) {
  const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }';
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const l = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
  return n => gl.getUniformLocation(pr, n);
}
const RUIDO = `
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn2(vec2 x){ vec2 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y); }
float fbm2(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 6; i++){ s += a * vn2(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 3.1; a *= .5; } return s; }`;

/* ---------- mármore da parede (desenhado uma vez) ---------- */
const cm = $('#marmore'), gm = cm.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
const FSM = `precision highp float;
uniform vec2 uRes; uniform float uSeed;
${RUIDO}
vec3 hex(float r, float g, float b){ return vec3(r, g, b) / 255.; }
void main(){
  vec2 p = gl_FragCoord.xy / uRes.y * 1.05 + uSeed;
  // fumaça roxa: ruído dobrado sobre si mesmo
  vec2 q = vec2(fbm2(p), fbm2(p + vec2(5.2, 1.3)));
  vec2 r = vec2(fbm2(p + 3.5 * q + vec2(1.7, 9.2)), fbm2(p + 3.5 * q + vec2(8.3, 2.8)));
  float f = fbm2(p + 3.2 * r);
  vec3 col = hex(248., 246., 250.);
  float fum = smoothstep(.42, .82, f);
  float denso = smoothstep(.62, .9, f) * smoothstep(.3, .8, length(r));
  col = mix(col, hex(196., 172., 226.), fum * .55);
  col = mix(col, hex(124., 70., 186.), fum * fum * .55);
  col = mix(col, hex(66., 16., 102.), denso * .7);
  col *= .97 + .05 * vn2(gl_FragCoord.xy * .6);
  // veios cinza bem finos da pedra
  float g1 = fbm2(p * .9 + 4.0 * q);
  float vc = abs(fract(g1 * 9.) - .5);
  col = mix(col, hex(170., 160., 185.), smoothstep(.02, .0, vc) * .12);
  // veios de ouro: linhas finas que seguem a fumaça
  vec2 pv = p * .32 + .9 * q;
  float g2 = vn2(pv * 1.3 + 11.) * .7 + vn2(pv * 3.1 + 2.) * .3;
  float v1 = abs(g2 - .5), v2 = abs(vn2(pv * 2.2 + 31.) * .75 + vn2(pv * 5. + 9.) * .25 - .5);
  float px = 1.2 / uRes.y * 1.05;
  float ouro = smoothstep(.0055 + px, .0, v1) * smoothstep(.15, .42, fbm2(p * .7 + 3.))
             + .8 * smoothstep(.004 + px, .0, v2) * smoothstep(.45, .68, fbm2(p * 1.3 + 7.));
  ouro = clamp(ouro, 0., 1.);
  float brilho = .55 + .45 * vn2(p * 9.);
  vec3 dourado = mix(hex(154., 101., 16.), hex(255., 214., 120.), brilho);
  col = mix(col, dourado, ouro);
  gl_FragColor = vec4(col, 1.);
}`;
const um = programa(gm, FSM);
function pintaMarmore() {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  cm.width = Math.round(innerWidth * dpr); cm.height = Math.round(innerHeight * dpr);
  gm.viewport(0, 0, cm.width, cm.height);
  gm.uniform2f(um('uRes'), cm.width, cm.height); gm.uniform1f(um('uSeed'), 2.7);
  gm.drawArrays(gm.TRIANGLES, 0, 3);
}

/* ---------- a nuvem roxa fofa ---------- */
const cn = $('#nuvem'), gn = cn.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });
const FSN = `precision highp float;
uniform vec2 uRes; uniform float uT, uResp, uAfunda, uAmassa, uDist; uniform vec2 uPonto, uGiro;
float h31(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
  return mix(mix(mix(h31(i), h31(i+vec3(1,0,0)), f.x), mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x), mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z); }
float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float bola(vec3 p, vec3 c, float r, float i){ return length(p - c) - r * (1. + uResp * .045 * sin(uT * 1.15 + i * 1.9)); }
float elip(vec3 p, vec3 c, vec3 r){ vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.) / max(k1, 1e-4); }
float forma(vec3 p){
  // corpo largo e achatado + poucas cúpulas grandes de tamanhos diferentes
  float d = elip(p, vec3(0., -.22, 0.), vec3(1.18, .36, .62) * (1. + uResp * .02 * sin(uT * 1.1)));
  d = smin(d, bola(p, vec3(-.36, .14, .02), .5, 1.), .14);
  d = smin(d, bola(p, vec3(.28, .3, -.02), .58, 2.), .14);
  d = smin(d, bola(p, vec3(.08, .78, .02), .34, 3.), .09);
  d = smin(d, bola(p, vec3(.78, .02, .04), .37, 4.), .1);
  d = smin(d, bola(p, vec3(-.86, -.06, .0), .33, 5.), .1);
  d = smin(d, bola(p, vec3(-.52, .5, -.04), .26, 6.), .07);
  d = smin(d, bola(p, vec3(.62, .48, .08), .24, 7.), .07);
  d = smin(d, bola(p, vec3(-.12, -.06, .42), .32, 8.), .08);
  d = smin(d, bola(p, vec3(.46, -.1, .38), .28, 9.), .08);
  d = smin(d, bola(p, vec3(.0, .2, -.42), .46, 10.), .12);
  d = smin(d, bola(p, vec3(-1.12, -.22, .02), .2, 11.), .07);
  d = smin(d, bola(p, vec3(1.1, -.24, .04), .19, 12.), .07);
  d = -smin(-d, (p.y + .52), .1);
  return d;
}
vec3 local(vec3 p){
  p.y -= sin(uT * .8) * .03 * uResp;
  p.y /= (1. - uAmassa * .18); p.xz /= (1. + uAmassa * .09);
  p.xz = rot(uGiro.x) * p.xz; p.yz = rot(uGiro.y) * p.yz;
  return p;
}
float mapa(vec3 pw){
  vec3 p = local(pw);
  float d = forma(p);
  // afundar onde o dedo ou o mouse encosta (empurra para dentro, na direção da câmera)
  vec2 dp = pw.xy - uPonto;
  d += uAfunda * .16 * exp(-dot(dp, dp) * 9.);
  // couve-flor: dobras finas só perto da superfície
  if (d < .1) {
    vec3 q = p * 3.1 + vec3(0., uT * .05, 0.);
    d += (vn(q) - .5) * .028;
  }
  return d;
}
vec3 normal(vec3 p){ vec2 e = vec2(.0018, -.0018);
  return normalize(e.xyy*mapa(p+e.xyy) + e.yyx*mapa(p+e.yyx) + e.yxy*mapa(p+e.yxy) + e.xxx*mapa(p+e.xxx)); }
vec3 hex(float r, float g, float b){ return vec3(r, g, b) / 255.; }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
  vec3 ro = vec3(0., .18, uDist), rd = normalize(vec3(uv, -1.75));
  // esfera de contorno: se o raio não passa perto, sai cedo
  vec3 oc = ro - vec3(0., .1, 0.); float b = dot(oc, rd), c = dot(oc, oc) - 2.0;
  if (b * b - c < 0.) { gl_FragColor = vec4(0.); return; }
  float t = max(0., -b - sqrt(max(b * b - c, 0.))), d; bool bateu = false;
  for (int i = 0; i < 110; i++) { d = mapa(ro + rd * t); if (d < .001) { bateu = true; break; } t += d * .75; if (t > 7.5) break; }
  if (!bateu) { gl_FragColor = vec4(0.); return; }
  vec3 p = ro + rd * t, n = normal(p), v = -rd;
  vec3 L = normalize(vec3(-.45, .85, .55)), Lb = normalize(vec3(.2, -.6, .8)), Lr = normalize(vec3(.7, .3, -.65));
  float ao = clamp(mapa(p + n * .05) / .05, 0., 1.) * .45 + clamp(mapa(p + n * .16) / .16, 0., 1.) * .55;
  float wrap = max((dot(n, L) + .45) / 1.45, 0.);
  float baixo = max(dot(n, Lb), 0.);
  float aro = pow(1. - max(dot(n, v), 0.), 2.6);
  float cetim = pow(max(dot(n, normalize(L + v)), 0.), 18.);
  vec3 sombra = hex(30., 4., 50.), meio = hex(82., 22., 138.), luz = hex(128., 58., 214.), topo = hex(176., 128., 246.);
  float lz = wrap * (.55 + .45 * ao);
  vec3 col = mix(sombra, meio, smoothstep(.05, .5, lz));
  col = mix(col, luz, smoothstep(.4, .85, lz));
  col = mix(col, topo, smoothstep(.78, 1., lz) * .65);
  col *= .35 + .65 * ao;
  col += hex(190., 160., 220.) * baixo * .07 * ao;
  col += hex(150., 80., 255.) * aro * .28 * (.4 + .6 * ao);
  col += vec3(1., .95, 1.) * cetim * .1 * ao;
  col += hex(255., 220., 160.) * pow(max(dot(n, Lr), 0.), 3.) * .06;
  col = col / (1. + col * .12);
  gl_FragColor = vec4(col, 1.);
}`;
const un = programa(gn, FSN);
let dist = 4.6;
const N = { resp: reduz ? 0 : 1, afunda: 0, afv: 0, alvoAfunda: 0, amassa: 0, amv: 0, px: 0, py: 0, tx: 0, ty: 0, gx: 0, gy: -.08, alvoGx: 0, alvoGy: -.08, giro: 0 };
function tamNuvem() {
  const r = cn.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, leve ? 1.25 : 1.5);
  cn.width = Math.max(2, Math.round(r.width * dpr)); cn.height = Math.max(2, Math.round(r.height * dpr));
  gn.viewport(0, 0, cn.width, cn.height);
  dist = Math.max(4.6, 4.6 * 1.55 / (cn.width / cn.height));
}
// ponto do dedo/mouse em coordenadas da cena (aprox. no plano da nuvem)
function aCena(e) {
  const r = cn.getBoundingClientRect();
  const x = (e.clientX - r.left - r.width / 2) / r.height, y = -(e.clientY - r.top - r.height / 2) / r.height;
  return [x * dist / 1.75 * .92, y * dist / 1.75 * .92 + .18];
}
let dentro = false;
cn.addEventListener('pointermove', e => {
  const [x, y] = aCena(e); N.tx = x; N.ty = y; dentro = Math.abs(x) < 1.4 && y > -.7 && y < 1.15; N.alvoAfunda = dentro ? .55 : 0;
  const r = cn.getBoundingClientRect();
  N.alvoGx = ((e.clientX - r.left) / r.width - .5) * .5; N.alvoGy = -.08 + ((e.clientY - r.top) / r.height - .5) * .25;
});
cn.addEventListener('pointerleave', () => { N.alvoAfunda = 0; N.alvoGx = 0; N.alvoGy = -.08; });
cn.addEventListener('pointerdown', e => {
  const [x, y] = aCena(e); N.tx = x; N.ty = y; N.px = x; N.py = y;
  N.afv += 6; N.amv += 5.5;
});

/* ---------- laço ---------- */
let ult = performance.now(), tempo = 0;
function quadro(agora) {
  const dt = Math.min(.05, (agora - ult) / 1000); ult = agora;
  if (!reduz) tempo += dt;
  // molas (macio, com balanço)
  N.afv += ((N.alvoAfunda - N.afunda) * 60 - N.afv * 9) * dt; N.afunda += N.afv * dt;
  N.amv += ((0 - N.amassa) * 90 - N.amv * 7) * dt; N.amassa += N.amv * dt;
  N.px += (N.tx - N.px) * (1 - Math.exp(-dt * 10)); N.py += (N.ty - N.py) * (1 - Math.exp(-dt * 10));
  N.gx += (N.alvoGx - N.gx) * (1 - Math.exp(-dt * 3)); N.gy += (N.alvoGy - N.gy) * (1 - Math.exp(-dt * 3));
  if (!reduz) N.giro = Math.sin(tempo * .25) * .35;
  gn.uniform2f(un('uRes'), cn.width, cn.height); gn.uniform1f(un('uDist'), dist); gn.uniform1f(un('uT'), tempo);
  gn.uniform1f(un('uResp'), N.resp); gn.uniform1f(un('uAfunda'), Math.max(-.2, N.afunda)); gn.uniform1f(un('uAmassa'), N.amassa);
  gn.uniform2f(un('uPonto'), N.px, N.py); gn.uniform2f(un('uGiro'), N.giro + N.gx, N.gy);
  gn.clearColor(0, 0, 0, 0); gn.clear(gn.COLOR_BUFFER_BIT); gn.drawArrays(gn.TRIANGLES, 0, 3);
  const s = 1 + Math.sin(tempo * .8) * .04 * N.resp - N.amassa * .1;
  $('#sombra').style.transform = `scale(${s.toFixed(3)},${(1 + N.amassa * .2).toFixed(3)})`;
  requestAnimationFrame(quadro);
}
function tudo() { pintaMarmore(); tamNuvem(); }
addEventListener('resize', tudo);
tudo();
requestAnimationFrame(quadro);
})();
</script>
