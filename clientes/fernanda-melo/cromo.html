<title>Cromo Fernanda Melo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Topo: uma escultura de cromo líquido que muda de forma devagar, refletindo Deep Purple e ouro, na frente do nome gigante em ouro.
   Fundo branco com textura de pedra quase invisível. Visual único (claro). */
:root{--branco:#FFFFFF;--roxo:#6B21A8;--berinjela:#3B0A57;--ouro:#FBBF24;--ouro-escuro:#9A6510;--tinta:#1E0B30;
  --fd:'DM Serif Display',Georgia,serif;--fb:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--sai:cubic-bezier(.16,1,.3,1);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--tinta);font-family:var(--fb);-webkit-font-smoothing:antialiased;background-color:var(--branco);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .54  0 0 0 0 .58  0 0 0 .04 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");background-size:300px 300px}
.topo{position:fixed;inset:0 0 auto;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--berinjela)}
.marca small{font:600 .6rem/1 var(--fb);letter-spacing:.32em;text-transform:uppercase}
.marca span{font:italic 400 1.25rem/1.1 var(--fd);color:var(--roxo)}
.menu{display:flex;gap:clamp(1rem,2.4vw,2rem);font:500 .74rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase}
.menu a{color:var(--berinjela);text-decoration:none}
.agendar{font:600 .74rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--branco);background:var(--berinjela);text-decoration:none;border-radius:99px;padding:1em 1.5em;transition:box-shadow .4s var(--sai)}
.agendar:hover{box-shadow:0 0 0 3px var(--ouro)}
@media (max-width:820px){.menu{display:none}}
.nome{position:fixed;inset:0;z-index:1;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
  font:400 clamp(4rem,18.5vw,20rem)/.84 var(--fd);letter-spacing:-.02em;text-transform:uppercase;text-align:center;
  background:linear-gradient(176deg,#FFE7A0 0%,#F7B92A 28%,#C98712 52%,#F2B42C 66%,#9A6510 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.nome span{display:block}
#cena{position:fixed;inset:0;width:100%;height:100%;z-index:2;display:block}
.base{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1.2rem;
  padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.base p{margin:0;max-width:24rem;font:500 clamp(.95rem,1.3vw,1.05rem)/1.5 var(--fb);text-wrap:balance}
.base em{font:italic 400 1.15em/1 var(--fd);color:var(--roxo)}
.cta{display:inline-flex;align-items:center;gap:.8em;background:var(--roxo);color:var(--branco);text-decoration:none;font:600 .8rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;
  padding:1.2em 2em;border-radius:99px;box-shadow:0 0 0 0 var(--ouro),0 16px 36px -16px rgb(59 10 87/.8);transition:box-shadow .45s var(--sai),transform .45s var(--sai)}
.cta:hover{box-shadow:0 0 0 3px var(--ouro),0 20px 40px -16px rgb(59 10 87/.9);transform:translateY(-2px)}
@media (max-width:640px){.base{justify-content:center;text-align:center}.base p{max-width:none}}
:focus-visible{outline:3px solid var(--ouro-escuro);outline-offset:3px}
.aviso{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:2rem;text-align:center;background:var(--branco)}
</style>

<header class="topo">
  <a class="marca" href="#"><small>Barbearia</small><span>Fernanda Melo</span></a>
  <nav class="menu" aria-label="Principal"><a href="#">O salão</a><a href="#">Cortes</a><a href="#">Serviços</a><a href="#">Equipe</a></nav>
  <a class="agendar" href="https://barber-pro-1f2a60f6.base44.app/agendamentocliente" target="_blank" rel="noopener">Agendar</a>
</header>
<h1 class="nome"><span>Fernanda</span><span>Melo</span></h1>
<canvas id="cena" aria-hidden="true"></canvas>
<div class="base">
  <p>Corte, barba e cuidado num salão de <em>mármore, ouro e roxo</em>.</p>
  <a class="cta" href="https://barber-pro-1f2a60f6.base44.app/agendamentocliente" target="_blank" rel="noopener">Agendar horário <span aria-hidden="true">→</span></a>
</div>
<p class="aviso" id="aviso">Este navegador não conseguiu mostrar o 3D. Abra no Chrome, Safari ou Edge atualizados.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
if (!window.THREE) { document.getElementById('aviso').style.display = 'grid'; return; }
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const leve = matchMedia('(max-width: 760px), (pointer: coarse)').matches;
const cv = document.getElementById('cena');
let ren;
try { ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true }); } catch (e) { document.getElementById('aviso').style.display = 'grid'; return; }
ren.setPixelRatio(Math.min(devicePixelRatio || 1, leve ? 1.5 : 2));
ren.outputEncoding = THREE.sRGBEncoding;
ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.15;
const cena = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, .1, 100); cam.position.set(0, 0, 7.2);

/* ---------- estúdio de luz que o cromo reflete: painéis brancos, roxos e dourados ---------- */
function estudio() {
  const s = new THREE.Scene();
  const fundo = new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({ color: 0x140a1c, side: THREE.BackSide }));
  s.add(fundo);
  const painel = (cor, w, h, pos, alvo, forca = 1) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(cor).multiplyScalar(forca), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(...alvo); s.add(m);
  };
  painel(0xffffff, 14, 3, [0, 9, 2], [0, 0, 0], 3.2);
  painel(0xffffff, 1.2, 12, [-4, 2, 8], [0, 0, 0], 2.6);
  painel(0xffffff, 1, 10, [7, 3, 4], [0, 0, 0], 2.2);
  painel(0x6B21A8, 6, 14, [-9, 0, 2], [0, 0, 0], .85);
  painel(0x3B0A57, 8, 14, [9, 0, -3], [0, 0, 0], 1.2);
  painel(0x8B2CFF, 4, 10, [6, 1, 7], [0, 0, 0], .6);
  painel(0xFBBF24, 10, 1.4, [-2, -6, 5], [0, 0, 0], 2.4);
  painel(0xF59E0B, 2, 9, [-6, -1, 8], [0, 0, 0], 1.6);
  painel(0x1a0b24, 18, 6, [0, -9, -2], [0, 0, 0], 1);
  const pm = new THREE.PMREMGenerator(ren);
  const env = pm.fromScene(s, .02).texture; pm.dispose();
  return env;
}
cena.environment = estudio();

/* ---------- a escultura: esfera que vira metal líquido (deformação na placa de vídeo) ---------- */
const geo = new THREE.SphereGeometry(1, leve ? 160 : 260, leve ? 120 : 200);
const mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: .06, clearcoat: 1, clearcoatRoughness: .04, envMapIntensity: 1.25 });
const U = { uT: { value: 0 }, uAmp: { value: .32 }, uFreq: { value: .72 } };
const RUIDO = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);} vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){ const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx); vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857; vec3 ns=n_*D.wyz-D.xzx; vec4 j=p-49.*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y); vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.)); vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3))); p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3))); }
uniform float uT, uAmp, uFreq;
float forma(vec3 p){
  float t = uT * .18;
  float n = snoise(p * uFreq + vec3(t, t * .7, -t * .5)) * .8 + snoise(p * uFreq * 1.9 + vec3(-t * 1.1, t, t * .4)) * .12;
  return 1. + n * uAmp;
}
vec3 desloca(vec3 p){ vec3 d = normalize(p); return d * forma(d); }`;
mat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, U);
  sh.vertexShader = RUIDO + '\n' + sh.vertexShader
    .replace('#include <beginnormal_vertex>', `
      vec3 pBase = normalize(position);
      vec3 tg = normalize(abs(pBase.y) < .99 ? cross(pBase, vec3(0., 1., 0.)) : cross(pBase, vec3(1., 0., 0.)));
      vec3 bt = normalize(cross(pBase, tg));
      float e = .012;
      vec3 c0 = desloca(pBase), c1 = desloca(pBase + tg * e), c2 = desloca(pBase + bt * e);
      vec3 objectNormal = normalize(cross(c1 - c0, c2 - c0));
      if (dot(objectNormal, pBase) < 0.) objectNormal = -objectNormal;`)
    .replace('#include <begin_vertex>', 'vec3 transformed = c0;');
};
const blob = new THREE.Mesh(geo, mat);
cena.add(blob);

/* ---------- tamanho ---------- */
function tam() {
  const w = innerWidth, h = innerHeight;
  ren.setSize(w, h, false); cam.aspect = w / h;
  // a escultura ocupa mais ou menos a mesma área em qualquer tela
  cam.position.z = Math.max(7.2, 1.85 / (Math.tan(THREE.MathUtils.degToRad(15)) * (w / h)));
  cam.updateProjectionMatrix();
}
addEventListener('resize', tam); tam();

/* ---------- movimento: só assistir (deriva lenta, gira, respira) ---------- */
const m = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener('pointermove', e => { m.tx = (e.clientX / innerWidth - .5); m.ty = (e.clientY / innerHeight - .5); });
let ult = performance.now(), t = reduz ? 3 : 0;
function quadro(agora) {
  const dt = Math.min(.05, (agora - ult) / 1000); ult = agora;
  if (!reduz) t += dt;
  m.x += (m.tx - m.x) * (1 - Math.exp(-dt * 1.5)); m.y += (m.ty - m.y) * (1 - Math.exp(-dt * 1.5));
  U.uT.value = t;
  blob.rotation.y = t * .12 + m.x * .35;
  blob.rotation.x = Math.sin(t * .2) * .18 + m.y * .25;
  blob.position.y = Math.sin(t * .5) * .06;
  ren.render(cena, cam);
  if (!reduz) requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
})();
</script>
