<style>
/* Abertura: a noite da fachada é a cena; o vidro racha em ouro e entrega o branco com fumaça roxa.
   Visual único (não segue tema claro/escuro do visitante): noite → branco. */
:root{
  --branco:#FFFFFF; --roxo:#6B21A8; --berinjela:#3B0A57; --ouro:#FBBF24; --ouro-sombra:#B7791F;
  --noite:#05070F; --tinta:#1E0B30;
  --fd:'DM Serif Display',Georgia,'Times New Roman',serif;
  --fb:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sai:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--branco);color:var(--tinta);font-family:var(--fb);-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* camadas */
.camada{position:fixed;inset:0;width:100%;height:100%}
#fumaca{z-index:2;pointer-events:none}
#veios{z-index:3;pointer-events:none;overflow:visible}
#cena{z-index:5;background:var(--noite);transform-origin:0 0;overflow:hidden}
#ceu,#fachada{position:absolute;inset:0;width:100%;height:100%;display:block}
#cacos{z-index:6;pointer-events:none}
#racha{z-index:7;pointer-events:none}

/* topo e herói (o que fica depois da abertura) */
.topo{position:fixed;inset:0 0 auto;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));opacity:0}
.marca{font:600 .72rem/1 var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--berinjela);text-decoration:none}
.marca em{font:italic 400 1.15rem/1 var(--fd);letter-spacing:0;text-transform:none;color:var(--roxo);margin-left:.35em}
.pilula{font:600 .72rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--roxo);text-decoration:none;
  border:1.5px solid var(--roxo);border-radius:99px;padding:.75em 1.3em;background:rgb(255 255 255/.82);transition:background .3s,color .3s}
.pilula:hover{background:var(--roxo);color:var(--branco)}

.hero{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  gap:clamp(.9rem,2.2vh,1.5rem);visibility:hidden;
  padding-block:calc(72px + env(safe-area-inset-top,0px)) calc(72px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero.on{visibility:visible}
.sobre{margin:0;font:600 .78rem/1 var(--fb);letter-spacing:.32em;text-transform:uppercase;color:var(--roxo);opacity:0}
#titulo{width:min(88vw,62rem);height:auto;overflow:visible;display:block}
.frase{margin:0;max-width:34rem;font:400 clamp(1rem,1.6vw,1.15rem)/1.6 var(--fb);color:var(--tinta);text-wrap:balance;opacity:0}
.cta{display:inline-flex;align-items:center;gap:.8em;background:var(--roxo);color:var(--branco);text-decoration:none;
  font:600 .82rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;padding:1.15em 2.1em;border-radius:99px;opacity:0;
  box-shadow:0 0 0 0 var(--ouro),0 14px 34px -14px rgb(107 33 168/.7);transition:box-shadow .45s var(--sai),transform .45s var(--sai)}
.cta span{display:inline-block;transition:transform .45s var(--sai)}
.cta:hover{box-shadow:0 0 0 3px var(--ouro),0 18px 40px -14px rgb(107 33 168/.8);transform:translateY(-2px)}
.cta:hover span{transform:translateX(4px)}
.servicos{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem .6rem;opacity:0;
  font:500 .72rem/1.4 var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--berinjela)}
.servicos li{display:flex;align-items:center;gap:.6rem}
.servicos li+li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--ouro);box-shadow:0 0 0 1px var(--ouro-sombra)}

/* controles */
.ctrl{position:fixed;z-index:9;display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;
  right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ctrl button{font:500 .68rem/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border-radius:99px;padding:.85em 1.25em;
  transition:background .3s,color .3s,border-color .3s}
body.noite .ctrl button{color:#F1ECFA;background:rgb(255 255 255/.06);border:1px solid rgb(255 255 255/.22);backdrop-filter:blur(6px)}
body.noite .ctrl button:hover{background:rgb(255 255 255/.16)}
body.dia .ctrl button{color:var(--berinjela);background:rgb(255 255 255/.7);border:1px solid rgb(59 10 87/.25);backdrop-filter:blur(6px)}
body.dia .ctrl button:hover{border-color:var(--roxo);color:var(--roxo)}
.ctrl button[aria-pressed="true"]{border-color:var(--ouro)!important}
:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}

@media (max-width:640px){
  #titulo{width:min(84vw,24rem)}
  .marca{font-size:.62rem;letter-spacing:.14em}
  .marca em{font-size:1rem}
  .servicos{font-size:.64rem;letter-spacing:.14em;gap:.3rem .45rem;max-width:19rem}
  .servicos li{gap:.45rem}
}
</style>

    // só de cima e dos lados (não atravessa o texto de baixo)
    const a = Math.PI * (1.0 + (i + rnd(.15, .85)) / n * 1.0) + rnd(-.1, .1) - Math.PI * .08;
    const ca = Math.cos(a), sa = Math.sin(a);
    const kx = ca > 0 ? (W + 30 - cx) / ca : (-30 - cx) / ca, ky = sa < 0 ? (-30 - cy) / sa : 1e9;
    const k = Math.min(Math.abs(kx), Math.abs(ky));
    const ini = { x: cx + ca * k, y: cy + sa * k };
    const fim = { x: Math.min(r.right + 6, Math.max(r.left - 6, cx + ca * r.width * .56)), y: Math.min(r.bottom, Math.max(r.top - 8, cy + sa * r.height * .62)) };
    const pts = [ini]; const L = Math.hypot(fim.x - ini.x, fim.y - ini.y), nx = -(fim.y - ini.y) / L, ny = (fim.x - ini.x) / L;
    for (let j = 1; j < 4; j++) { const t = j / 4, o = rnd(-.09, .09) * L; pts.push({ x: ini.x + (fim.x - ini.x) * t + nx * o, y: ini.y + (fim.y - ini.y) * t + ny * o }); }
    pts.push(fim);
    veioTracos.push(veio(pts, rnd(1.1, 2.1)));
    if (Math.random() < .75) {
      const m = pts[2], ab = a + rnd(.5, 1.1) * (Math.random() < .5 ? -1 : 1), lb = rnd(50, 150);
      veioTracos.push(veio([m, { x: m.x + Math.cos(ab) * lb * .5 + rnd(-10, 10), y: m.y + Math.sin(ab) * lb * .5 }, { x: m.x + Math.cos(ab) * lb, y: m.y + Math.sin(ab) * lb }], .8));
    }
  }
  const y = r.bottom + 2, x0 = r.left + r.width * .02, x1 = r.right - r.width * .02, pts = [];
  for (let j = 0; j <= 6; j++) pts.push({ x: x0 + (x1 - x0) * j / 6, y: y + Math.sin(j * 1.3) * 2.5 + (j === 6 ? -3 : 0) });
  sublinhado = veio(pts, 2.2);
}
function mostraFinal(instant) {
  hero.classList.add('on'); document.body.classList.remove('noite'); document.body.classList.add('dia');
  montaTitulo(); geraVeios();
  const L = 2200;
  tituloTexto.style.strokeDasharray = L;
  const textos = ['.sobre', '.frase', '.cta', '.servicos'];
  if (instant || reduz) {
    for (const p of veioTracos.flat().concat(sublinhado)) p.style.strokeDashoffset = 0;
    tituloTexto.style.strokeDashoffset = 0; tituloTexto.setAttribute('fill-opacity', 1); tituloTexto.setAttribute('stroke-opacity', 0);
    gsap.set(textos, { opacity: 1, y: 0 }); gsap.set('.topo', { opacity: 1 });
    terminou(); return;
  }
  tituloTexto.style.strokeDashoffset = L;
  ft = gsap.timeline({ onComplete: terminou });
  ft.to(veioTracos.flat(), { strokeDashoffset: 0, duration: 1.1, ease: 'power2.inOut', stagger: .035 }, 0)
    .to(tituloTexto, { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut' }, .35)
    .to(tituloTexto, { attr: { 'fill-opacity': 1 }, duration: .8, ease: 'power2.out' }, 1.3)
    .to(tituloTexto, { attr: { 'stroke-opacity': 0 }, duration: .7 }, 1.75)
    .to(sublinhado, { strokeDashoffset: 0, duration: .9, ease: 'expo.out' }, 1.55)
    .fromTo('.sobre', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .9, ease: 'expo.out' }, 1.45)
    .fromTo(['.frase', '.cta', '.servicos'], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 1, ease: 'expo.out', stagger: .1 }, 1.75)
    .fromTo('.topo', { opacity: 0 }, { opacity: 1, duration: .8 }, 2.0);
}
function terminou() {
  st.final = true; bPular.hidden = true; bDenovo.hidden = false;
  try { localStorage.setItem('fm-abertura-v1', '1'); } catch (e) {}
}

/* ---------- som (gerado, sem arquivo) ---------- */
const Som = {
  ctx: null, on: false, hum: null,
  ruido() {
    const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 1.5, this.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b;
  },
  liga() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
      this.mestre = this.ctx.createGain(); this.mestre.gain.value = .9; this.mestre.connect(this.ctx.destination); this.buf = this.ruido();
    }
    this.ctx.resume(); this.on = true;
    if (st.neon && !st.quebrou) this.humOn();
    return true;
  },
  desliga() { this.on = false; this.humOff(); },
  humOn() {
    if (!this.on || this.hum) return;
    const c = this.ctx, g = c.createGain(), lp = c.createBiquadFilter(), o1 = c.createOscillator(), o2 = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain();
    o1.type = 'sawtooth'; o1.frequency.value = 120; o2.type = 'sine'; o2.frequency.value = 60;
    lp.type = 'lowpass'; lp.frequency.value = 650; lfo.frequency.value = 9; lg.gain.value = .006;
    lfo.connect(lg); lg.connect(g.gain); o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.mestre);
    g.gain.setValueAtTime(0, c.currentTime); g.gain.linearRampToValueAtTime(.03, c.currentTime + .3);
    [o1, o2, lfo].forEach(o => o.start()); this.hum = { g, os: [o1, o2, lfo] };
  },
  humOff() {
    if (!this.hum) return; const c = this.ctx, h = this.hum; this.hum = null;
    h.g.gain.cancelScheduledValues(c.currentTime); h.g.gain.setTargetAtTime(0, c.currentTime, .04);
    h.os.forEach(o => o.stop(c.currentTime + .3));
  },
  ruidoCurto(dur, tipo, freq, ganho, q = 1, quando = 0) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + quando;
    s.buffer = this.buf; f.type = tipo; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(ganho, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.mestre); s.start(t, rnd(0, .8)); s.stop(t + dur + .05);
  },
  clique() { if (this.on) this.ruidoCurto(.03, 'bandpass', 2600, .22, 1.2); },
  whoosh(d) {
    if (!this.on) return; const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
    s.buffer = this.buf; s.loop = true; f.type = 'bandpass'; f.Q.value = .8;
    f.frequency.setValueAtTime(220, t); f.frequency.exponentialRampToValueAtTime(2600, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + d * .95); g.gain.exponentialRampToValueAtTime(.0001, t + d + .05);
    s.connect(f); f.connect(g); g.connect(this.mestre); s.start(t); s.stop(t + d + .1);
  },
  vidro() {
    if (!this.on) return; const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(38, t + .3);
    g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.0001, t + .35); o.connect(g); g.connect(this.mestre); o.start(t); o.stop(t + .4);
    this.ruidoCurto(.45, 'highpass', 1400, .75, .7);
    this.ruidoCurto(.9, 'bandpass', 5200, .18, 2, .05);
    for (let i = 0; i < 22; i++) {
      const q = c.createOscillator(), qg = c.createGain(), w = t + .03 + Math.pow(Math.random(), 1.6) * 1.1, dur = rnd(.06, .26);
      q.type = 'triangle'; q.frequency.value = rnd(2800, 8200);
      qg.gain.setValueAtTime(rnd(.03, .1), w); qg.gain.exponentialRampToValueAtTime(.0001, w + dur);
      q.connect(qg); qg.connect(this.mestre); q.start(w); q.stop(w + dur + .02);

  }
};
bSom.addEventListener('click', () => {
  if (Som.on) { Som.desliga(); bSom.textContent = 'Som desligado'; bSom.setAttribute('aria-pressed', 'false'); }
  else if (Som.liga()) { bSom.textContent = 'Som ligado'; bSom.setAttribute('aria-pressed', 'true'); }
});

/* ---------- cena inicial ---------- */
const tubos = $$('#neon .tubo'), tubo = $('#tubo');
let LN = 2304;
function preparaCena() {
  tl && tl.kill(); ft && ft.kill(); ft = null;
  LN = tubo.getTotalLength();
  gsap.set('#breu', { opacity: .82 }); gsap.set(['#interior', '#espelhos', '#letreiro', '#brilhoNeon', '#faisca'], { opacity: 0 });
  gsap.set('#poste', { opacity: .25 }); gsap.set('#reflexo', { attr: { x: -500 } });
  tubos.forEach(p => { p.style.strokeDasharray = LN; p.style.strokeDashoffset = LN; });
  cam.e = 0; aplicaCam(); cena.style.visibility = 'visible';
  racha.ativa = false; racha.c = 0; vidro = null; foto = null; fum = []; faiscas = [];
  for (const c of [cRacha, cCacos]) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  cFum.getContext('2d').clearRect(0, 0, cFum.width, cFum.height);
  hero.classList.remove('on'); veiosSvg.innerHTML = '';
  gsap.set(['.sobre', '.frase', '.cta', '.servicos', '.topo'], { opacity: 0 });
  tituloTexto.setAttribute('fill-opacity', 0); tituloTexto.setAttribute('stroke-opacity', 1);
  document.body.classList.add('noite'); document.body.classList.remove('dia');
  Object.assign(st, { neon: false, quebrou: false, final: false, fase: 'cena' });
  bPular.hidden = false; bDenovo.hidden = true;
}
function acendeNeonPonto() {
  const off = parseFloat(tubo.style.strokeDashoffset) || 0, p = tubo.getPointAtLength(Math.max(0, Math.min(LN, LN - off)));
  $('#faisca').setAttribute('transform', `translate(${p.x} ${p.y})`);
}
function quebra() {
  st.quebrou = true; Som.humOff(); Som.vidro();
  geraVidro(); racha.ativa = true; racha.c = 0;
  st.quebraT = performance.now() / 1000;
}
function estilhaca() {
  if (!vidro) geraVidro();
  if (!foto) preparaFoto();
  racha.ativa = false; desenhaRacha();
  cena.style.visibility = 'hidden';
  document.body.classList.remove('noite'); document.body.classList.add('dia');
  geraFaiscas(); geraFumaca();
  st.fase = 'cacos'; st.cacoT = st.fumT = performance.now() / 1000;
}
function montaTimeline(curta) {
  const neon = { o: LN };
  tl = gsap.timeline({ paused: true });
  tl.to('#breu', { opacity: .16, duration: 1.6, ease: 'power2.inOut' }, .45)
    .call(() => { st.neon = true; Som.humOn(); }, null, 1.0)
    .to('#faisca', { opacity: 1, duration: .08 }, 1.0)
    .to(tubos, { strokeDashoffset: 0, duration: 1.3, ease: 'power2.inOut', onUpdate: acendeNeonPonto }, 1.0)
    .to('#faisca', { opacity: 0, duration: .25 }, 2.25)
    .to('#brilhoNeon', { opacity: 1, duration: .9, ease: 'power2.out' }, 1.5)
    .to('#interior', { keyframes: [{ opacity: .4, duration: .05 }, { opacity: .06, duration: .09 }, { opacity: .75, duration: .07 }, { opacity: .3, duration: .06 }, { opacity: 1, duration: .35 }] }, 1.65)
    .to('#espelhos', { opacity: 1, duration: .6, ease: 'expo.out' }, 2.0)
    .to('#poste', { opacity: 1, duration: .3 }, 2.1)
    .to('#letreiro', { keyframes: [{ opacity: 1, duration: .04 }, { opacity: .12, duration: .07 }, { opacity: 1, duration: .05 }, { opacity: .35, duration: .1 }, { opacity: 1, duration: .25 }] }, 2.4)
    .call(() => Som.clique(), null, 2.4).call(() => Som.clique(), null, 2.51).call(() => Som.clique(), null, 2.6)
    .call(() => Som.whoosh(1.0), null, 3.2)
    .to(cam, { e: 1, duration: 1.0, ease: 'power2.in', onUpdate: () => aplicaCam() }, 3.2)
    .fromTo('#reflexo', { attr: { x: -500 } }, { attr: { x: 1700 }, duration: .85, ease: 'power1.inOut' }, 3.22)
    .call(preparaFoto, null, 3.3)
    .call(quebra, null, 4.2)
    .to(racha, { c: 1, duration: .42, ease: 'power2.out' }, 4.2)
    .call(estilhaca, null, 4.66)
    .call(() => mostraFinal(false), null, 5.2);
  if (curta) {
    tl.seek(2.95, true); st.neon = true; Som.humOn(); tl.timeScale(1.25);
  }
  tl.play();
}

/* ---------- laço de desenho ---------- */
let ult = performance.now() / 1000, acumulado = 0;
function tick() {
  const agora = performance.now() / 1000, dt = Math.min(.05, agora - ult); ult = agora;
  if (cena.style.visibility !== 'hidden') {
    desenhaCeu(dt);
    posteOff = (posteOff + dt * 26) % 22; $('#pPoste').setAttribute('patternTransform', `rotate(35) translate(0 ${posteOff.toFixed(2)})`);
    if (racha.ativa) {
      const k = Math.max(0, .25 - (agora - st.quebraT)) * 26;
      aplicaCam(rnd(-k, k), rnd(-k, k));
      desenhaRacha();
    }
  }
  if (st.fase === 'cacos') {
    const t = agora - st.cacoT;
    if (vidro && !desenhaCacos(t) && t > .5) { st.fase = 'fumaca'; cCacos.getContext('2d').clearRect(0, 0, cCacos.width, cCacos.height); }
  }
  if (fum.length && !reduz) {
    const t = agora - st.fumT;
    if (t < 6 || !leve) {
      acumulado += dt;
      if (t < 6 || acumulado > 1 / 30) { passoFumaca(t, t < 6 ? dt : acumulado); desenhaFumaca(t); acumulado = 0; }
    }
  }
  requestAnimationFrame(tick);
}

/* ---------- pular, repetir, redimensionar ---------- */
function pular() {
  if (st.final && !ft) return;
  tl && tl.kill(); ft && ft.kill(); ft = null;
  Som.humOff();
  racha.ativa = false; desenhaRacha();
  cCacos.getContext('2d').clearRect(0, 0, cCacos.width, cCacos.height);
  cena.style.visibility = 'hidden'; st.fase = 'fim';
  fumacaEmRepouso();
  mostraFinal(true);
}
bPular.addEventListener('click', pular);
bDenovo.addEventListener('click', () => { medir(); preparaCena(); montaTimeline(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !st.final) pular(); });

let largura = innerWidth, timer;
addEventListener('resize', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (Math.abs(innerWidth - largura) < 40 && st.fase !== 'fim' && !st.final) return;
    largura = innerWidth;
    if (!st.final) { medir(); pular(); return; }
    medir(); fumacaEmRepouso(); mostraFinal(true);
  }, 150);
});

/* ---------- início ---------- */
let visto = false; try { visto = localStorage.getItem('fm-abertura-v1') === '1'; } catch (e) {}
const fontes = document.fonts ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
medir(); preparaCena(); desenhaCeu(0);
fontes.then(() => {
  if (reduz) { cena.style.visibility = 'hidden'; st.fase = 'fim'; fumacaEmRepouso(); mostraFinal(true); return; }
  requestAnimationFrame(tick);
  montaTimeline(visto);
});
})();
