<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abertura Body Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap">
<style>
:root{
  --preto:#0a0a0b;
  --carvao:#151517;
  --linha:#2a2a2e;
  --texto:#f3f3f4;
  --suave:#a9a9b0;
  --vermelho:#D7192A;
  --vermelho-escuro:#8e0f1a;
  --ouro:#f6b445;
  --fonte-titulo:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --fonte-texto:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --calha:max(28px,env(safe-area-inset-left,0px));
  --calha-d:max(28px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}

html,body{margin:0;background:#000;color:#f3f3f4;font-family:var(--fonte-texto)}
*{box-sizing:border-box}
.cromo{background:linear-gradient(180deg,#ffffff 0%,#d9dadd 30%,#8d9096 52%,#f4f4f5 64%,#a4a6ab 82%,#5e6066 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 14px 22px rgba(0,0,0,.55))}
/* ===== Abertura (tela cheia, ~5,5 s, uma vez por visita) ===== */
.abertura{position:fixed;inset:0;z-index:100;background:#000;overflow:hidden;display:none;contain:strict}
.com-abertura .abertura{display:block}
.com-abertura body{overflow:hidden}
.ab-cam,.ab-cena,.ab-haze,.ab-flash,.ab-giz,.ab-marca{position:absolute;inset:0}
.ab-cena{opacity:0}
.ab-cena img{width:100%;height:100%;object-fit:cover;object-position:56% 62%}
.ab-haze{background:radial-gradient(70% 60% at 50% 52%,rgba(150,10,24,.55),rgba(0,0,0,0) 72%),radial-gradient(130% 100% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);opacity:0}
.ab-luz{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;transform:scaleX(0);opacity:0;
  background:linear-gradient(90deg,rgba(246,180,69,0) 0%,#ffd58a 50%,rgba(246,180,69,0) 100%);box-shadow:0 0 26px 5px rgba(246,180,69,.5)}
.ab-flash{opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at 56% 74%,#fff6e0 0%,#ffc56b 22%,rgba(215,25,42,.55) 50%,rgba(0,0,0,0) 78%)}
.ab-giz{width:100%;height:100%;pointer-events:none}
.ab-marca{display:grid;place-items:center;pointer-events:none}
.ab-logo{position:absolute;left:50%;top:50%;width:min(78vw,78vh);height:min(78vw,78vh);margin:calc(min(78vw,78vh)/-2) 0 0 calc(min(78vw,78vh)/-2);
  border-radius:50%;opacity:0;mix-blend-mode:screen;filter:saturate(1.25) brightness(1.1);
  -webkit-mask-image:radial-gradient(circle at 50% 47%,#000 26%,rgba(0,0,0,0) 52%);mask-image:radial-gradient(circle at 50% 47%,#000 26%,rgba(0,0,0,0) 52%)}
.ab-nome{position:relative;display:inline-block;opacity:0;font-family:var(--fonte-titulo);font-size:clamp(74px,16vw,270px);line-height:.9;letter-spacing:.015em;text-transform:uppercase;white-space:nowrap}
.ab-nome .cromo{display:block}
.ab-brilho{position:absolute;top:0;bottom:0;left:0;width:16%;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0),#000 50%,rgba(0,0,0,0));mask-image:linear-gradient(90deg,rgba(0,0,0,0),#000 50%,rgba(0,0,0,0))}
.ab-brilho span{position:absolute;top:0;left:0;white-space:nowrap;padding:.22em .02em .12em;margin-top:-.22em;
  background:linear-gradient(180deg,#fff7e2 0%,#ffd27a 45%,#c98a22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ab-sub{position:absolute;left:0;right:0;top:calc(50% + clamp(54px,9.5vw,160px));text-align:center;opacity:0;
  font:700 clamp(11px,1vw,14px)/1 var(--fonte-texto);letter-spacing:.5em;text-transform:uppercase;color:var(--ouro)}
.ab-barra{position:absolute;left:0;right:0;height:12.5%;background:#000;z-index:4}
.ab-barra.cima{top:0;transform-origin:50% 0}
.ab-barra.baixo{bottom:0;transform-origin:50% 100%}
.ab-progresso{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:5;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,var(--vermelho),var(--ouro))}
.ab-pular{position:absolute;z-index:6;right:var(--calha-d);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);cursor:pointer;
  font:600 11px/1 var(--fonte-texto);letter-spacing:.32em;text-transform:uppercase;color:#d6d6da;background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.22);border-radius:40px;padding:12px 18px;transition:background-color .3s,border-color .3s}
.ab-pular:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.5)}


.abertura{display:block}
#painel{position:fixed;z-index:200;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s}
#painel.fim{opacity:1;pointer-events:auto}
#painel button{font:700 13px/1 var(--fonte-texto);letter-spacing:.08em;color:#fff;background:#1a1a1d;border:1px solid #3a3a40;border-radius:40px;padding:13px 18px;cursor:pointer}
#painel button.on{background:var(--vermelho);border-color:var(--vermelho)}
#painel button:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
</style>
</head>
<body>
<div class="abertura" id="abertura" aria-hidden="true">
  <div class="ab-cam">
    <div class="ab-cena" id="ab-queda"><img src="midia/abertura-queda.webp" width="1536" height="864" alt="" decoding="async"></div>
    <div class="ab-cena" id="ab-impacto"><img src="midia/abertura-impacto.webp" width="1536" height="864" alt="" decoding="async"></div>
    <div class="ab-haze"></div>
    <div class="ab-luz"></div>
    <div class="ab-flash"></div>
    <canvas class="ab-giz"></canvas>
    <div class="ab-marca">
      <img class="ab-logo" src="midia/logo.webp" width="476" height="476" alt="">
      <div class="ab-nome"><span class="cromo">Body Gym</span><span class="ab-brilho"><span>Body Gym</span></span></div>
      <span class="ab-sub">Mineiros · GO — desde 2019</span>
    </div>
  </div>
  <div class="ab-barra cima"></div><div class="ab-barra baixo"></div>
  <div class="ab-progresso"></div>
  <button class="ab-pular" type="button" tabindex="-1">Pular</button>
</div>


<div id="painel" role="group" aria-label="Controles da abertura">
  <button type="button" data-vel="1" class="on">Rever 1x</button>
  <button type="button" data-vel="0.5">Câmera lenta 0,5x</button>
  <button type="button" data-vel="0.25">Quadro a quadro 0,25x</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  var q=function(s,c){return (c||document).querySelector(s)}, qa=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))};
  var desk=matchMedia('(min-width: 761px)').matches, lenis=null;
  /* velocidade escolhida vem na URL (?vel=0.5) */
  var v0=+new URLSearchParams(location.search).get('vel'); if(v0) window.VEL=v0;
  qa('#painel button').forEach(function(x){ x.classList.toggle('on', +x.dataset.vel===(window.VEL||1)); });
  /* Giz: partículas de magnésio iluminadas (canvas 2D, leve no celular) */
  function Giz(cv, o){
    var ctx=cv.getContext('2d'), P=[], dpr=Math.min(window.devicePixelRatio||1,2), W=0, H=0, mx=-9999, my=-9999, ativo=true, ult=0;
    o=Object.assign({max:220, ambiente:0, gravidade:-6, origem:null},o||{});
    function mede(){ var r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
    mede(); addEventListener('resize',mede);
    function poe(x,y,vx,vy,vida,r){ if(P.length>=o.max) P.shift(); P.push({x:x,y:y,vx:vx,vy:vy,v:vida,m:vida,r:r,o:Math.random()<.68}); }
    function explode(x,y,n,forca){
      for(var i=0;i<n;i++){ var a=-Math.PI*(.05+.9*Math.random()), s=forca*(.25+Math.random()*.9);
        poe(x+(Math.random()-.5)*30, y, Math.cos(a)*s*(Math.random()<.5?-1:1), Math.sin(a)*s, 1.2+Math.random()*1.8, .6+Math.random()*2.2); }
    }
    function passo(t){
      if(!ativo){ ult=0; return; }
      var dt=ult?Math.min(.05,(t-ult)/1000):.016; ult=t;
      if(o.ambiente && o.origem){ var q=o.ambiente*dt; while(q>0){ if(Math.random()<q){ var g=o.origem();
        poe(g.x+(Math.random()-.5)*g.w, g.y+(Math.random()-.5)*g.h, 6+Math.random()*14, -(8+Math.random()*22), 3+Math.random()*4, .5+Math.random()*1.6);} q-=1; } }
      ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
      for(var i=P.length-1;i>=0;i--){ var p=P[i]; p.v-=dt; if(p.v<=0){ P.splice(i,1); continue; }
        var dx=p.x-mx, dy=p.y-my, d2=dx*dx+dy*dy;
        if(d2<16900){ var d=Math.sqrt(d2)||1, f=(130-d)/130*420*dt; p.vx+=dx/d*f; p.vy+=dy/d*f; }
        p.vx*=Math.pow(.35,dt); p.vy=p.vy*Math.pow(.35,dt)+o.gravidade*dt*4; p.x+=p.vx*dt; p.y+=p.vy*dt;
        var vida=p.v/p.m, al=Math.min(1,vida*1.6)*Math.min(1,(p.m-p.v)*6)*.85;
        ctx.fillStyle=p.o?'rgba(255,206,130,'+al+')':'rgba(255,246,232,'+(al*.8)+')';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); }
      ctx.globalCompositeOperation='source-over';
    }
    gsap.ticker.add(function(){ passo(performance.now()); });
    return { explode:explode, mira:function(x,y){mx=x;my=y}, liga:function(v){ ativo=v; if(!v) ctx.clearRect(0,0,W,H); }, tam:function(){return{w:W,h:H}} };
  }


  /* Abertura de cinema */
  function abertura(){
    var A=q('#abertura'); var raiz=document.documentElement;
    var cvA=q('.ab-giz',A), gA=Giz(cvA,{max:desk?420:220, gravidade:9});
    var nome=q('.ab-nome',A), brilho=q('.ab-brilho',A), brilhoTxt=q('.ab-brilho span',A), pular=q('.ab-pular',A);
    var acabou=false;
    function fim(){ if(acabou) return; acabou=true; q('#painel').classList.add('fim'); }
    window.tlAbertura=null;
    var tl=window.tlAbertura=gsap.timeline({paused:true, defaults:{ease:'expo.out'}, onComplete:fim});
    var W=innerWidth, H=innerHeight;
    function treme(t,forca,n){ for(var i=0;i<n;i++){ var k=1-i/n; tl.to('.ab-cam',{x:(Math.random()-.5)*forca*k,y:(Math.random()-.5)*forca*k,duration:.045,ease:'none'},t+i*.045); } tl.to('.ab-cam',{x:0,y:0,duration:.08,ease:'power2.out'},t+n*.045); }

    // 0 – 0,8 s · preto + fio de luz dourada
    tl.to('.ab-progresso',{scaleX:1,duration:5.4,ease:'none'},0)
      .to('.ab-luz',{opacity:1,duration:.25,ease:'power2.out'},.12)
      .to('.ab-luz',{scaleX:1,duration:.9,ease:'expo.inOut'},.12)
    // 0,8 – 2,2 s · câmera lenta: desce rente ao piso atrás da anilha
      .to('.ab-luz',{scaleY:60,opacity:0,duration:.6,ease:'power3.in'},.85)
      .to('#ab-queda',{opacity:1,duration:.5,ease:'power2.out'},.95)
      .fromTo('#ab-queda img',{scale:1.42,yPercent:-7,rotation:-3},{scale:1.14,yPercent:0,rotation:0,duration:1.45,ease:'power2.inOut'},.95)
      .to('.ab-haze',{opacity:.9,duration:1.2,ease:'power2.out'},.95)
    // 2,2 – 3,2 s · IMPACTO
      .set('#ab-queda',{opacity:0},2.3)
      .set('#ab-impacto',{opacity:1},2.3)
      .fromTo('#ab-impacto img',{scale:1.2},{scale:1.02,duration:1.1,ease:'power4.out'},2.3)
      .fromTo('.ab-flash',{opacity:0},{opacity:1,duration:.05,ease:'none'},2.28)
      .to('.ab-flash',{opacity:0,duration:.7,ease:'power2.out'},2.33)
      .add(function(){ var x=W*(desk?.56:.6), y=H*.72; gA.explode(x,y,desk?260:150,desk?900:620); gA.explode(x,y,desk?120:70,420); },2.3);
    treme(2.3,desk?42:28,9);
    // 2,9 s · as faixas de cinema abrem: tela inteira
    tl.to('.ab-barra.cima,.ab-barra.baixo',{scaleY:0,duration:1.1,ease:'expo.inOut'},2.75)
    // 3,2 – 4,4 s · a marca carimba em cromo
      .to('#ab-impacto',{opacity:.22,duration:.5,ease:'power2.out'},3.1)
      .fromTo('.ab-logo',{opacity:0,scale:1.25},{opacity:.42,scale:1,duration:1.4,ease:'power3.out'},3.05)
      .fromTo(nome,{opacity:0,scale:2.3},{opacity:1,scale:1,duration:.42,ease:'power4.in'},3.15)
      .add(function(){ gA.explode(W*.5,H*.56,desk?140:80,520); },3.57);
    treme(3.57,desk?26:18,7);
    tl.fromTo('.ab-sub',{opacity:0,y:12},{opacity:1,y:0,duration:.9},3.8)
      .add(function(){ var w=nome.offsetWidth; gsap.fromTo(brilho,{x:-.25*w},{x:w*1.05,duration:.9,ease:'power2.inOut'}); gsap.fromTo(brilhoTxt,{x:.25*w},{x:-w*1.05,duration:.9,ease:'power2.inOut'}); },3.75)
    // 4,4 – 5,5 s · a câmera avança e vira o novo topo
      .to('.ab-cam',{scale:1.6,duration:1.05,ease:'power3.in'},4.45)
      .to(A,{opacity:0,duration:.6,ease:'power2.in'},4.85);

    function corta(){ if(acabou) return; tl.pause(); gsap.to(A,{opacity:0,duration:.4,ease:'power2.out',onComplete:fim}); }
    pular.addEventListener('click',corta);
    addEventListener('keydown',function k(e){ if(e.key==='Escape'){ corta(); removeEventListener('keydown',k); } });

    // espera as imagens (no máximo 1 s) e roda
    var imgs=qa('.ab-cena img',A).map(function(i){ return i.decode?i.decode().catch(function(){}):Promise.resolve(); });
    Promise.race([Promise.all(imgs), new Promise(function(r){setTimeout(r,1000)})]).then(function(){ tl.timeScale(window.VEL||1).play(0); });
  }

  abertura();
  qa('#painel button').forEach(function(b){ b.addEventListener('click',function(){
    window.VEL=+b.dataset.vel; qa('#painel button').forEach(function(x){x.classList.toggle('on',x===b)});
    var u=new URL(location.href); u.searchParams.set('vel',b.dataset.vel); location.replace(u.toString());
  }); });
})();
</script>
</body>
</html>
