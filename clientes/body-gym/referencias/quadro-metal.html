<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quadro metal</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
// Quadros parados (referência 2: "metal martelado + estilhaços + clarão azul") com o texto da Body Gym.
// ?palavra=SIMPLES|BODY GYM|TREINO  ?quadro=1 (macro) | 2 (revelação)  ?estilo=metal|lava
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const U = new URLSearchParams(location.search), Q = +(U.get('quadro') || 2), PAL = (U.get('palavra') || 'BODY GYM').toUpperCase(), LAVA = U.get('estilo') === 'lava';
const W = innerWidth, H = innerHeight, celular = W < 761;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setPixelRatio(1); r.setSize(W, H, false); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0; r.outputColorSpace = THREE.SRGBColorSpace;
const cena = new THREE.Scene(); cena.background = new THREE.Color(LAVA ? 0x020101 : 0x02060a);
const cam = new THREE.PerspectiveCamera(Q === 1 ? 24 : 30, W / H, .02, 60);
function canvasTex(desenha, n = 1024) { const c = document.createElement('canvas'); c.width = c.height = n; desenha(c.getContext('2d'), n); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }

// estúdio escuro com faixas (reflexo do metal), levemente frio
const pm = new THREE.PMREMGenerator(r), est = new THREE.Scene(); est.background = new THREE.Color(0x010203);
const painel = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); est.add(m); };
painel(10, .6, 0, 5, 0, new THREE.Color(3, 3.3, 3.6)); painel(.6, 6, -6, 1, 2, new THREE.Color(1.6, 2.0, 2.4)); painel(.5, 6, 6, 1.5, -1, new THREE.Color(1.2, 1.5, 1.8));
painel(14, 1.4, 0, 3, 7, new THREE.Color(1.1, 1.25, 1.4)); painel(14, .8, 0, .6, 7, new THREE.Color(.02, .03, .04)); painel(14, .6, 0, -.4, 7, new THREE.Color(1.4, 1.0, .7)); painel(14, 1.5, 0, -1.8, 7, new THREE.Color(.25, .3, .35));
cena.environment = pm.fromScene(est, 0).texture;

// metal martelado: amassados redondos sobrepostos
const martelo = canvasTex((x, n) => { x.fillStyle = '#7a7a7a'; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 1400; i++) { const cx = Math.random() * n, cy = Math.random() * n, rr = 18 + Math.random() * 46, g = x.createRadialGradient(cx, cy, 0, cx, cy, rr);
    const v = Math.random() < .5 ? 255 : 0; g.addColorStop(0, `rgba(${v},${v},${v},.10)`); g.addColorStop(1, `rgba(${v},${v},${v},0)`); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, rr, 0, 6.3); x.fill(); }
  x.filter = 'blur(3px)'; x.drawImage(x.canvas, 0, 0); x.filter = 'none'; });
martelo.repeat.set(1.3, 1.3);
const pedra = canvasTex((x, n) => { x.fillStyle = '#555'; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 9000; i++) { const s = 2 + Math.random() * 26, g = 30 + Math.random() * 190 | 0; x.fillStyle = `rgba(${g},${g},${g},${.05 + Math.random() * .25})`; x.beginPath(); x.ellipse(Math.random() * n, Math.random() * n, s, s * (.4 + Math.random() * .8), Math.random() * 3, 0, 6.3); x.fill(); } });
const rachas = canvasTex((x, n) => { x.fillStyle = '#000'; x.fillRect(0, 0, n, n); x.lineCap = 'round';
  for (let k = 0; k < 46; k++) { let px = Math.random() * n, py = Math.random() * n, a = Math.random() * 6.28; const passos = 8 + Math.random() * 26 | 0;
    for (let i = 0; i < passos; i++) { const nx = px + Math.cos(a) * (6 + Math.random() * 18), ny = py + Math.sin(a) * (6 + Math.random() * 18);
      x.strokeStyle = `rgba(255,${120 + Math.random() * 80 | 0},40,${.5 + Math.random() * .5})`; x.lineWidth = .6 + Math.random() * 2.4; x.shadowColor = '#ff3010'; x.shadowBlur = 8;
      x.beginPath(); x.moveTo(px, py); x.lineTo(nx, ny); x.stroke(); px = nx; py = ny; a += (Math.random() - .5) * 1.2; } } });
pedra.repeat.set(2.2, 2.2); rachas.repeat.set(.7, .7);

let face, lado, costura = null;
if (LAVA) {
  face = new THREE.MeshStandardMaterial({ color: 0x5a5450, roughness: .7, metalness: .35, bumpMap: pedra, bumpScale: 1.6, roughnessMap: pedra, emissive: 0xff3a10, emissiveMap: rachas, emissiveIntensity: .55, envMapIntensity: .3 });
  lado = new THREE.MeshStandardMaterial({ color: 0x1e1b1a, roughness: .85, metalness: .2, bumpMap: pedra, bumpScale: 2, emissive: 0xff2a0c, emissiveMap: rachas, emissiveIntensity: 1.4, envMapIntensity: .3 });
  costura = new THREE.MeshStandardMaterial({ color: 0x200000, emissive: 0xff3412, emissiveIntensity: 2.4, roughness: .6 });
} else {
  face = new THREE.MeshPhysicalMaterial({ color: 0xdfe6eb, metalness: 1, roughness: .24, roughnessMap: martelo, bumpMap: martelo, bumpScale: 1.1, clearcoat: .5, clearcoatRoughness: .15 });
  lado = new THREE.MeshPhysicalMaterial({ color: 0x8b98a2, metalness: 1, roughness: .34, roughnessMap: martelo, bumpMap: martelo, bumpScale: .9 });
}
// luzes
const k1 = new THREE.DirectionalLight(LAVA ? 0xc8d2dc : 0xd7e6f2, LAVA ? 1.6 : 1.2); k1.position.set(-2.5, 4, 3); cena.add(k1);
const k3 = new THREE.DirectionalLight(0xffb070, LAVA ? 2.2 : 3.0); k3.position.set(1.5, 2.5, -3); cena.add(k3);   // recorte quente pega o chanfro
if (LAVA) { const kp = new THREE.PointLight(0xff4a1a, 2.5, 8, 1.6); kp.position.set(-1.2, .6, 1.4); cena.add(kp); }

// névoa (fria no metal, quente na lava)
const fumTex = canvasTex((x, n) => { for (let i = 0; i < 60; i++) { const cx = n * (.2 + Math.random() * .6), cy = n * (.2 + Math.random() * .6), rr = n * (.08 + Math.random() * .25);
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, rr); g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, n, n); } }, 512);
for (let i = 0; i < 14; i++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(9, 5), new THREE.MeshBasicMaterial({ map: fumTex, color: LAVA ? (i % 3 ? 0x2a0e08 : 0x3a160c) : (i % 3 ? 0x051418 : 0x0a2024), transparent: true, opacity: LAVA ? .35 : .4, depthWrite: false, blending: THREE.AdditiveBlending }));
  m.position.set((Math.random() - .5) * 6, -1 + Math.random() * 2, -2.5 - Math.random() * 4); m.rotation.z = Math.random() * 6; cena.add(m); }
// brasas (poucas no metal)
const nB = LAVA ? 500 : 120, pb = new Float32Array(nB * 3), cb = new Float32Array(nB * 3);
for (let i = 0; i < nB; i++) { pb[i * 3] = (Math.random() - .5) * 8; pb[i * 3 + 1] = -1.2 + Math.random() * 3.5; pb[i * 3 + 2] = -4 + Math.random() * 6; const h = Math.random(); cb[i * 3] = 1; cb[i * 3 + 1] = .3 + h * .45; cb[i * 3 + 2] = .05 + h * .1; }
const gb = new THREE.BufferGeometry(); gb.setAttribute('position', new THREE.BufferAttribute(pb, 3)); gb.setAttribute('color', new THREE.BufferAttribute(cb, 3));
cena.add(new THREE.Points(gb, new THREE.PointsMaterial({ size: .03, vertexColors: true, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false })));
// estilhaços de metal voando (só no metal)
if (!LAVA) { const ests = new THREE.MeshPhysicalMaterial({ color: 0xb8c4cc, metalness: 1, roughness: .3, bumpMap: martelo, bumpScale: 2 });
  for (let i = 0; i < 70; i++) { const s = .03 + Math.random() * .16, g = new THREE.TetrahedronGeometry(s, 0); g.scale(1, .25 + Math.random() * .5, 1 + Math.random());
    const m = new THREE.Mesh(g, ests); m.position.set((Math.random() - .5) * 7, -1.2 + Math.random() * 3.2, -3 + Math.random() * 5.5); m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6); cena.add(m); } }

new FontLoader().load('../midia/anton-3d.json', fonte => {
  const grupo = new THREE.Group(); cena.add(grupo);
  const linhas = (celular && PAL.indexOf(' ') > 0) ? PAL.split(' ') : [PAL];
  linhas.forEach((txt, i) => {
    const g = new TextGeometry(txt, { font: fonte, size: 1, height: .42, depth: .42, curveSegments: 10, bevelEnabled: true, bevelThickness: .05, bevelSize: .03, bevelSegments: 4 });
    g.computeBoundingBox(); const b = g.boundingBox; g.translate(-(b.min.x + b.max.x) / 2, -b.min.y - i * 1.12, -(b.min.z + b.max.z) / 2);
    const p = g.attributes.position, uv = g.attributes.uv; for (let k = 0; k < p.count; k++) uv.setXY(k, p.getX(k) * .35, p.getY(k) * .35 + p.getZ(k) * .35);
    grupo.add(new THREE.Mesh(g, [face, lado]));
    if (costura) { const c = new TextGeometry(txt, { font: fonte, size: 1, height: .035, depth: .035, curveSegments: 10, bevelEnabled: true, bevelThickness: .004, bevelSize: .036, bevelSegments: 1 });
      c.computeBoundingBox(); const bc = c.boundingBox; c.translate(-(bc.min.x + bc.max.x) / 2, -b.min.y - i * 1.12, -(bc.min.z + bc.max.z) / 2); grupo.add(new THREE.Mesh(c, costura)); }
  });
  const caixa = new THREE.Box3().setFromObject(grupo), centro = caixa.getCenter(new THREE.Vector3()), larg = caixa.max.x - caixa.min.x;
  grupo.position.sub(centro); grupo.rotation.y = -.18; grupo.rotation.x = .05;
  let alvo;
  if (Q === 1) { cam.position.set(-larg * .36, .3, 1.7); alvo = new THREE.Vector3(-larg * .26, .2, 0); cam.lookAt(alvo); cam.rotateZ(.12); }
  else { const d = (larg / 2) / Math.tan(Math.atan(Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2) * cam.aspect)) / (celular ? .8 : .66);
    cam.position.set(larg * .08, .25, d); alvo = new THREE.Vector3(0, 0, 0); cam.lookAt(alvo); }
  // clarão de lente horizontal (azul no metal)
  if (!LAVA && Q === 2) { const fl = canvasTex((x, n) => { const g = x.createLinearGradient(0, 0, n, 0); g.addColorStop(0, 'rgba(120,180,255,0)'); g.addColorStop(.5, 'rgba(220,240,255,1)'); g.addColorStop(1, 'rgba(120,180,255,0)');
      x.fillStyle = g; x.fillRect(0, n / 2 - 1, n, 2); x.globalAlpha = .35; x.fillRect(0, n / 2 - 4, n, 8); x.globalAlpha = 1; const g2 = x.createRadialGradient(n * .62, n / 2, 0, n * .62, n / 2, 14); g2.addColorStop(0, 'rgba(255,255,255,.9)'); g2.addColorStop(1, 'rgba(160,200,255,0)'); x.fillStyle = g2; x.fillRect(0, 0, n, n); }, 1024);
    const f = new THREE.Mesh(new THREE.PlaneGeometry(larg * 2.2, larg * 2.2), new THREE.MeshBasicMaterial({ map: fl, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: .6 }));
    f.position.set(0, -.05, .6); f.lookAt(cam.position); cena.add(f); }
  const comp = new EffectComposer(r); comp.addPass(new RenderPass(cena, cam));
  comp.addPass(new BokehPass(cena, cam, { focus: cam.position.distanceTo(Q === 1 ? new THREE.Vector3(-larg * .34, .2, .25) : alvo), aperture: Q === 1 ? .008 : .002, maxblur: Q === 1 ? .012 : .006 }));
  comp.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), LAVA ? .5 : .35, .35, LAVA ? .7 : .85));
  comp.addPass(new OutputPass());
  comp.render(); setTimeout(() => { comp.render(); document.title = 'pronto'; }, 300);
});
</script></body></html>
